<!doctype html>
<html lang="en">
<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>img2gd</title>

  <link rel="icon" type="image/png" href="../icon.png">
  <link rel="preload" as="font" type="font/woff2" href="../assets/fonts/pusab.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="../assets/fonts/aller.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="../assets/fonts/oxygene.woff2" crossorigin>

  <link rel="stylesheet" href="../global.css">
  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="../controls.css">
  <link rel="stylesheet" href="../options.css">
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="viewport.css">
  <link rel="stylesheet" href="rangevalues.css">
  <link rel="stylesheet" href="../lettering.css">

  <script src="../global.js" defer></script>
  <script src="../lettering.js" defer></script>
  <script src="src/render/canvas.js" defer></script>
  <script src="src/render/webgl.js" defer></script>
  <script src="src/fit/batch.js" defer></script>
  <script src="src/fit/sprites.js" defer></script>
  <script src="src/fit/pools.js" defer></script>
  <script src="src/fit/regions.js" defer></script>
  <script src="src/fit/transparency.js" defer></script>
  <script src="src/export/visibility.js" defer></script>
  <script src="src/fit/crop.js" defer></script>
  <script src="src/fit/photos.js" defer></script>
  <script src="src/fit/search.js" defer></script>
  <script src="src/export/gmd.js" defer></script>
  <script src="src/export/gdlvl.js" defer></script>
  <script src="src/atlas.js" defer></script>
  <script src="../options.js" defer></script>
  <script src="../buttonmotion.js" defer></script>
  <script src="src/render/viewport.js" defer></script>
  <script src="src/rangevalues.js" defer></script>
  <script src="index.js" defer></script>

</head>
<body class="gdtheme imgpage">

  <main class="maincontent">
    <header class="pagehead">
      <h1 class="pagetitle"><oxygene class="gdlogo">img2gd</oxygene></h1>
    </header>

    <section class="workspace">
      <form class="controlpanel panel gdpane" id="converter">
        <div class="sourcefields">
          <div class="uploadrow">
            <label class="dropzone">
              <input class="imagefile" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/svg+xml,.jpg,.jpeg,.png,.webp,.gif,.svg">
              <span class="droptitle">
                <span class="filecaption">Click to choose image...</span>
                <span class="filedimensions" hidden></span>
              </span>
            </label>
            <button class="gdbutton toolbutton examplebutton" type="button"><gold class="gdgold">Example</gold></button>
          </div>
          <cr class="dropsubtitle controlerror" role="status"></cr>
        </div>

        <div class="basicfields">
          <div class="fieldlabel sliderlabel objectlimitfield">
            <label for="objectlimit">Object limit:</label>
            <div class="gdslider">
              <input class="limitslider gdrange" id="objectlimit" type="range" min="50" max="2500" value="1500" step="1" data-edit-max="5000" data-limit-messages>
              <input class="rangevalueeditor" type="text" inputmode="numeric" value="1500" autocomplete="off" spellcheck="false" aria-label="Object limit value" aria-describedby="objectlimit-error">
            </div>
            <span class="rangevaluemessage" id="objectlimit-error" role="status" hidden><cr></cr><img alt="" hidden></span>
          </div>
          <div class="fieldlabel sliderlabel effortfield">
            <label for="effort">Effort:</label>
            <div class="gdslider">
              <input class="effortslider gdrange" id="effort" type="range" min="0" max="100" value="75" step="1">
              <input class="rangevalueeditor" type="text" inputmode="numeric" value="75" autocomplete="off" spellcheck="false" aria-label="Effort value" aria-describedby="effort-error">
            </div>
            <span class="rangevaluemessage" id="effort-error" role="status" hidden><cr></cr></span>
          </div>
        </div>
        <div class="settingsrow">
          <div class="settingactions">
            <button class="gdbutton startbutton" type="submit" disabled><gold class="gdgold">Start</gold></button>
            <button class="gdbutton toolbutton advancedopen" type="button" aria-haspopup="dialog"><gold class="gdgold">Advanced</gold></button>
            <cr class="fitmessage controlerror" role="status"></cr>
          </div>
          <label class="checklabel">
            <input class="croptoggleinput gdcheck" type="checkbox" aria-describedby="crophelp">
            <span>Crop to edges</span>
          </label>
          <span class="assistivetext" id="crophelp">Keep objects inside the image bounds.</span>
        </div>

        <dialog class="gdpane appdialog advanceddialog" aria-labelledby="advancedtitle">
          <div class="dialoghead">
            <h2 class="dialogtitle" id="advancedtitle"><gold>Advanced settings</gold></h2>
            <button class="gdbutton gdcircle dialogclose" type="button" aria-label="Close advanced settings" autofocus>
              <span class="gdcloseicon" aria-hidden="true"></span>
            </button>
          </div>
          <div class="dialogbody advancedfields">
            <div class="fieldlabel">
              <span class="optionlabel">Search mode</span>
              <select class="fitselect gdinput">
                <option value="auto" selected>Automatic</option>
                <option value="adaptive">Texture search</option>
                <option value="regions">Flat color regions</option>
                <option value="grid">Object grid</option>
              </select>
            </div>
            <div class="fieldlabel">
              <span class="optionlabel">Fitting coverage</span>
              <select class="coverageselect gdinput">
                <option value="1" selected>1 sample per pixel</option>
                <option value="2">4 samples per pixel</option>
              </select>
            </div>
            <div class="fieldlabel seedsearchfield" hidden>
              <span class="optionlabel">Max seed search</span>
              <select class="seedsearchselect gdinput">
                <option value="3" selected>3 starts</option>
                <option value="6">6 starts</option>
              </select>
            </div>
            <div class="fieldlabel">
              <span class="optionlabel">Sampling</span>
              <select class="samplerselect gdinput">
                <option value="average" selected>Area average</option>
                <option value="nearest">Nearest pixel</option>
              </select>
            </div>
            <div class="fieldlabel sliderlabel colourlevelsfield">
              <label for="colourlevels">Color levels</label>
              <div class="gdslider">
                <input class="colourslider gdrange" id="colourlevels" type="range" min="2" max="256" value="256" step="1">
                <input class="rangevalueeditor" type="text" inputmode="numeric" value="256" autocomplete="off" spellcheck="false" aria-label="Color levels value" aria-describedby="colourlevels-error">
              </div>
              <span class="rangevaluemessage" id="colourlevels-error" role="status" hidden><cr></cr></span>
            </div>
            <div class="fieldlabel sliderlabel pngscalefield">
              <label for="pngscale">PNG scale</label>
              <div class="gdslider">
                <input class="previewzoomslider gdrange" id="pngscale" type="range" min="0.15" max="0.60" value="0.35" step="0.01">
                <input class="rangevalueeditor" type="text" inputmode="decimal" value="0.35" autocomplete="off" spellcheck="false" aria-label="PNG scale value" aria-describedby="pngscale-error">
              </div>
              <span class="rangevaluemessage" id="pngscale-error" role="status" hidden><cr></cr></span>
            </div>
            <div class="fieldlabel">
              <span class="optionlabel">2.2 axis warp</span>
              <select class="warpselect gdinput">
                <option value="off">Off</option>
                <option value="on" selected>On</option>
              </select>
            </div>
            <div class="fieldlabel">
              <span class="optionlabel">Color channels</span>
              <select class="colourmode gdinput">
                <option value="hsv" selected>999 with HSV</option>
                <option value="channels">Separate</option>
              </select>
            </div>
          </div>
        </dialog>
      </form>

      <section class="previewpanel panel gdpane" aria-label="Generated level">
        <div class="previewport gdwell">
          <div class="viewframe" tabindex="0">
            <div class="previewimage" hidden>
              <canvas class="resultcanvas" width="640" height="420"></canvas>
              <div class="comparison" hidden>
                <canvas class="sourcecanvas" width="640" height="420" aria-hidden="true"></canvas>
                <span class="swipebar" aria-hidden="true"></span>
                <input class="swipeslider" type="range" min="0" max="100" value="50" step="1">
              </div>
            </div>
          </div>
          <div class="stats" tabindex="0" role="group" hidden>
            <span class="statrow" data-empty><span class="tilecount">--</span> objects</span>
            <span class="statrow" data-empty><span class="gridcount">--</span> <cr>R</cr><cg>G</cg><cl>B</cl> error</span>
            <span class="statrow" data-empty><span class="channelcount">--</span> channels</span>
            <span class="statrow" data-empty><span class="sizecount">--</span> size</span>
          </div>
          <div class="previewfooter">
            <p class="statusline" role="status">
              <span class="statuscopy gdplain"></span>
            </p>
            <div class="exportlinks">
              <a class="gdbutton gdlvldownload" aria-disabled="true" download><gold class="gdgold">.gdlvl</gold></a>
              <a class="gdbutton downloadlink" aria-disabled="true" download><gold class="gdgold">.gmd</gold></a>
              <a class="gdbutton pngdownload" aria-disabled="true" download><gold class="gdgold">.png</gold></a>
            </div>
          </div>
        </div>
        <div class="assistivetext" aria-hidden="true">
          <span class="assetstatus">Loading, one sec...</span>
          <span class="renderstate">Waiting...</span>
        </div>
      </section>
    </section>
  </main>
</body>
</html>
