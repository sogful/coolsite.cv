<!doctype html>
<html lang="en">
<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>img2gd</title>

  <link rel="icon" type="image/png" href="../icon.png">
  <link rel="preload" as="font" type="font/woff2" href="../assets/fonts/pusab.woff2" crossorigin>

  <link rel="stylesheet" href="../global.css">
  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="../lettering.css">

  <script src="../global.js" defer></script>
  <script src="../lettering.js" defer></script>
  <script src="src/render/canvas.js" defer></script>
  <script src="src/render/webgl.js" defer></script>
  <script src="src/fit/batch.js" defer></script>
  <script src="src/fit/sprites.js" defer></script>
  <script src="src/fit/pools.js" defer></script>
  <script src="src/fit/regions.js" defer></script>
  <script src="src/fit/transparency.js" defer></script>
  <script src="src/export/visibility.js" defer></script>
  <script src="src/fit/crop.js" defer></script>
  <script src="src/fit/photos.js" defer></script>
  <script src="src/fit/search.js" defer></script>
  <script src="src/export/gmd.js" defer></script>
  <script src="src/export/gdlvl.js" defer></script>
  <script src="src/catalog.js" defer></script>
  <script src="src/atlas.js" defer></script>
  <script src="index.js" defer></script>

</head>
<body class="gdtheme imgpage">
  <main class="maincontent">
    <header class="pagehead">
      <h1 class="pagetitle"><span class="gdlogo">img2gd</span></h1>
      <button class="gdbutton toolbutton catalogopen" type="button">Objects</button>
    </header>
    <section class="workspace" aria-label="Image to Geometry Dash level converter">
      <form class="controlpanel panel gdpane" id="converter">
        <div class="uploadrow">
          <label class="dropzone gdwell">
            <input class="imagefile" type="file" aria-label="Choose an image" accept="image/png,image/jpeg,image/webp,image/gif,image/svg+xml,.jpg,.jpeg,.png,.webp,.gif,.svg">
            <span class="droptitle">Choose image</span>
            <span class="dropsubtitle" role="status" hidden>JPG, PNG, WebP, GIF, SVG</span>
          </label>
          <button class="gdbutton gdsecondary toolbutton examplebutton" type="button">Example</button>
        </div>
        <p class="sourcename">Loading example</p>

        <div class="basicfields">
          <label class="fieldlabel">
            <span>Speed / accuracy</span>
            <select class="presetselect gdinput">
              <option value="fast">Fast</option>
              <option value="balanced">Balanced</option>
              <option value="detail" selected>Detail</option>
              <option value="max">Maximum</option>
            </select>
          </label>
          <label class="fieldlabel sliderlabel">
            <span>Object limit <b class="limitvalue">1,500</b></span>
            <span class="gdslider">
              <input class="limitslider gdrange" type="range" min="0" max="1500" value="1500" step="1">
            </span>
          </label>
        </div>
        <div class="settingsrow">
          <label class="checklabel">
            <input class="croptoggleinput gdcheck" type="checkbox" disabled aria-describedby="crophelp">
            <span>Crop to edges</span>
          </label>
          <span class="assistivetext" id="crophelp">Available for fully opaque images.</span>
          <button class="gdbutton gdsecondary toolbutton advancedopen" type="button">Advanced</button>
        </div>

        <dialog class="gdpane appdialog advanceddialog" aria-labelledby="advancedtitle">
          <div class="dialoghead">
            <h2 class="dialogtitle" id="advancedtitle"><span class="gdplain">Advanced settings</span></h2>
            <button class="gdbutton gdcircle dialogclose" type="button" aria-label="Close advanced settings">
              <svg class="gdcloseicon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12Z"/>
              </svg>
            </button>
          </div>
          <div class="dialogbody advancedfields">
            <label class="checklabel">
              <input class="underlaytoggleinput gdcheck" type="checkbox" checked>
              <span>Fill with the most common color</span>
            </label>
            <label class="fieldlabel">
              <span>Base shape</span>
              <select class="underlaystyle gdinput">
                <option value="single" selected>One scaled rectangle</option>
                <option value="tiled">Tiled rectangles</option>
              </select>
            </label>
            <label class="fieldlabel">
              <span>Search mode</span>
              <select class="fitselect gdinput">
                <option value="auto" selected>Automatic</option>
                <option value="adaptive">Texture search</option>
                <option value="regions">Flat color regions</option>
                <option value="grid">Object grid</option>
              </select>
            </label>
            <label class="fieldlabel">
              <span>Trials per object <b class="trialvalue">96</b></span>
              <span class="gdslider">
                <input class="trialslider gdrange" type="range" min="4" max="768" value="96" step="4">
              </span>
            </label>
            <label class="fieldlabel">
              <span>Fitting coverage</span>
              <select class="coverageselect gdinput">
                <option value="1" selected>1 sample per pixel</option>
                <option value="2">4 samples per pixel</option>
              </select>
            </label>
            <label class="fieldlabel seedsearchfield" hidden>
              <span>Maximum seed search</span>
              <select class="seedsearchselect gdinput">
                <option value="3" selected>3 starts</option>
                <option value="6">6 starts</option>
              </select>
            </label>
            <label class="fieldlabel">
              <span>Image sampling</span>
              <select class="samplerselect gdinput">
                <option value="average" selected>Area average</option>
                <option value="nearest">Nearest pixel</option>
              </select>
            </label>
            <label class="fieldlabel">
              <span>Color levels <b class="colourvalue">256</b></span>
              <span class="gdslider">
                <input class="colourslider gdrange" type="range" min="2" max="256" value="256" step="1">
              </span>
            </label>
            <label class="fieldlabel">
              <span>Preview zoom <b class="previewzoomvalue">0.35×</b></span>
              <span class="gdslider">
                <input class="previewzoomslider gdrange" type="range" min="0.15" max="0.60" value="0.35" step="0.01">
              </span>
              <small class="previewzoomhelp">PNG width 252 px</small>
            </label>
            <label class="fieldlabel">
              <span>2.2 axis warp</span>
              <select class="warpselect gdinput">
                <option value="off" selected>Off</option>
                <option value="on">On</option>
              </select>
            </label>
            <label class="fieldlabel">
              <span>Color mapping</span>
              <select class="colourmode gdinput">
                <option value="hsv" selected>HSV from red channel 999</option>
                <option value="channels">Native color channels</option>
              </select>
            </label>
          </div>
        </dialog>
      </form>

      <section class="previewpanel panel gdpane" aria-label="Image comparison">
        <div class="canvasgrid">
          <figure class="canvasfigure">
            <figcaption><span class="gdplain">Source</span></figcaption>
            <canvas class="sourcecanvas gdwell" width="640" height="420"></canvas>
          </figure>
          <figure class="canvasfigure">
            <figcaption><span class="gdgold">Level preview</span></figcaption>
            <canvas class="resultcanvas gdwell" width="640" height="420"></canvas>
          </figure>
        </div>
        <div class="stats">
          <span><b class="tilecount">0</b> objects</span>
          <span><b class="gridcount">--</b> RGB error</span>
          <span class="optionalstat"><b class="channelcount">0</b> channels</span>
          <span class="optionalstat"><b class="sizecount">0 KB</b> GMD</span>
        </div>
        <div class="exportlinks">
          <button class="gdbutton buildbutton" type="submit" form="converter">Build level</button>
          <a class="gdbutton gdsecondary downloadlink" hidden download>GMD</a>
          <a class="gdbutton gdsecondary gdlvldownload" hidden download>GDLVL</a>
          <a class="gdbutton gdsecondary pngdownload" hidden download>PNG</a>
        </div>
        <p class="statuscopy" aria-live="polite">Loading the example image.</p>
        <div class="assistivetext" aria-hidden="true">
          <span class="assetstatus">LOADING ATLAS</span>
          <span class="renderstate">WAITING</span>
        </div>
      </section>
    </section>

    <dialog class="gdpane appdialog catalogdialog" aria-labelledby="catalogtitle">
      <div class="dialoghead">
        <h2 class="dialogtitle" id="catalogtitle"><span class="gdplain">Native objects</span></h2>
        <button class="gdbutton gdcircle dialogclose" type="button" aria-label="Close native objects">
          <svg class="gdcloseicon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12Z"/>
          </svg>
        </button>
      </div>
      <div class="dialogbody">
        <label class="fieldlabel">
          <span>Find an object</span>
          <input class="catalogsearch gdinput" type="search" placeholder="ID, size or sprites" autocomplete="off">
        </label>
        <p class="catalogcount" aria-live="polite">Loading objects.</p>
        <div class="cataloggrid"></div>
        <button class="gdbutton toolbutton catalogmore" type="button" hidden>Show more</button>
      </div>
    </dialog>
  </main>
</body>
</html>
