<!DOCTYPE html>
<html lang="en">
<head>

    <title>gd stuff</title>
    <link rel="icon" type="image/png" href="icon.png">

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="googlebot" content="index,follow">
    <meta name="google" content="notranslate">

    <!-- the css import is too slow so this will almost always load faster -->
    <link rel="preload" as="font" type="font/woff2" href="assets/fonts/pusab.woff2" crossorigin>

    <style>

        * {cursor: url("assets/cursors/gd.cur"), default}
        .button, :any-link {cursor: url("assets/cursors/gd2.cur"), pointer}
        body {
            background-size: cover;
            color: white; height: 100vh; margin: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            
        }
        canvas, img, p, a {user-select: none}

        /*//////////////////////////////////////////////////////////////////////*/

        .me {
            width: 100px; margin-bottom: 1em;
            animation: spin 4s linear infinite;
        }
        @keyframes spin {
            0% {transform: rotate(0deg)}
            100% {transform: rotate(360deg)}
        }

        .text {
            margin-top: 0; max-width: 90%;
            width: auto; object-fit: contain;
        }

        /*//////////////////////////////////////////////////////////////////////*/

        .bottom {
            position: fixed; display: flex;
            bottom: 3em; gap: clamp(.5rem, 4vw, 1rem);
            justify-content: center; align-items: flex-start;
        }
        .button {
            display: flex; user-select: none;
            flex-direction: column; align-items: center;
            width: clamp(4rem, 24vw, 7rem); gap: .4rem;
            color: inherit; font-size: .8rem;
            line-height: 1.2; text-decoration: none;
        }
        .button img {
            width: clamp(3rem, 13vw, 4.5rem); aspect-ratio: 1;
            object-fit: contain;
        }
        .wip {filter: grayscale(1); opacity: 0.5}

    </style>
    <link rel="stylesheet" href="src/global.css">
    <link rel="stylesheet" href="/assets/static/bg.css">
    <script src="src/global.js" defer></script>
    <script src="/assets/static/js/bg.js" defer></script>

</head>
<body class="gdhub">

    <img class="me" src="assets/svgs/me.svg" draggable="false">
    <a class="text pusab">hello bro<sup>2</sup></a>

    <nav class="bottom">
        <!--a class="button" href="cbf">
            <img src="cbf/icon.png">
        </a-->
        <a class="button" href="audio/">
            <img src="audio/favicon.png" alt="">
            <span>audio archive</span>
        </a>
        <a class="button" href="img2gd/">
            <img src="img2gd/favicon.png" alt="">
            <span>img2gd</span>
        </a>
        <a class="button" href="https://github.com/sogful/newgroundsforgd">
            <img src="assets/images/newgroundsforgd/favicon.png" alt="">
            <span>newgrounds for gd</span>
        </a>
    </nav>

</body>
