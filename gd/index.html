<!DOCTYPE html>
<html lang="en">
<head>

    <title>gd stuff</title>
    <link rel="icon" type="image/png" href="icon.png">

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="googlebot" content="index,follow">
    <meta name="google" content="notranslate">

    <!-- the css import is too slow so this will almost always load faster -->
    <link rel="preload" as="font" type="font/woff2" href="assets/fonts/pusab.woff2" crossorigin>

    <style>

        body {
            background-size: cover;
            color: white; height: 100vh; margin: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            
        }
        canvas, img, p, a {user-select: none}
        /*//////////////////////////////////////////////////////////////////////*/

        .me {
            width: 100px; margin-bottom: 1em;
            animation: spin 4s linear infinite;
        }
        @keyframes spin {
            0% {transform: rotate(0deg)}
            100% {transform: rotate(360deg)}
        }

        .text {
            margin-top: 0; max-width: 90%;
            width: auto; object-fit: contain;
        }

        /*//////////////////////////////////////////////////////////////////////*/

        .bottom {
            position: fixed; display: flex;
            flex-direction: row;
            bottom: 3em; justify-content: center; align-items: center;
        }
        .button {
            display: flex;
            width: 0.75em; height: 0.75em;
            justify-content: center; align-items: center;
            overflow: hidden; user-select: none;
            padding: 0 0.1em;
        }
        .button img {
            width: 100%; height: 100%;
            object-fit: contain;
        }
        .wip {filter: grayscale(1); opacity: 0.5}

    </style>
    <link rel="stylesheet" href="global.css">
    <script src="global.js" defer></script>

</head>
<body>

    <img class="me" src="assets/svgs/me.svg" draggable="false">
    <a class="text pusab">hello bro<sup>2</sup></a>

    <div class="bottom">
        <!--a class="button" href="cbf">
            <img src="cbf/icon.png">
        </a-->
        <a class="button" href="audio">
            <img src="audio/icon.png">
        </a>
    </div>

</body>
