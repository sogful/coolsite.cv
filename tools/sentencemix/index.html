<!doctype html>
<html lang="en">
<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>sentence mixer</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2036%2036%22%3E%3Cpath%20fill%3D%22%233B88C3%22%20d%3D%22M36%2032c0%202.209-1.791%204-4%204H4c-2.209%200-4-1.791-4-4V4c0-2.209%201.791-4%204-4h28c2.209%200%204%201.791%204%204v28z%22%2F%3E%3Cpath%20fill%3D%22%23FFF%22%20d%3D%22M22.242%2022.242l2.829%202.829c-3.905%203.905-10.237%203.904-14.143-.001-2.247-2.246-3.194-5.296-2.854-8.225l-4.037.367c-.215%203.84%201.128%207.752%204.062%2010.687%205.467%205.467%2014.333%205.468%2019.799%200l2.828%202.828.849-9.334-9.333.849zM27.899%208.1C22.431%202.633%2013.568%202.633%208.1%208.1L5.272%205.272l-.849%209.334%209.334-.849-2.829-2.829c3.906-3.905%2010.236-3.905%2014.142%200%202.248%202.247%203.194%205.297%202.856%208.226l4.036-.366c.216-3.841-1.128-7.753-4.063-10.688z%22%2F%3E%3C%2Fsvg%3E">

    <link rel="stylesheet" href="../base.css">
    <link rel="stylesheet" href="index.css">
    
</head>
<body>
    <div class="page">

        <main>
            <section class="hero">
                <h1 class="title">sentence mixer</h1>
                <a>this can barely be called one, but shhhh</a>
            </section>

            <section class="tracks">
                <article class="trackcard sourcecard">
                    <label class="dropzone sourcedrop">
                        <span>audio:</span>
                        <input class="sourcefile fileinput" type="file" accept="audio/*">
                    </label>
                    <div class="trackmeta sourcemeta hidden" hidden>
                        <canvas class="sourcewave waveform" aria-hidden="true"></canvas>
                        <div class="fileline">
                            <span class="sourcefilename filename"></span>
                            <button class="clearbutton clearsource" type="button">remove</button>
                        </div>
                        <span class="sourcedetail trackdetail"></span>
                        <audio class="sourceplayer trackplayer" controls preload="metadata"></audio>
                    </div>
                </article>

                <div class="mixmark" aria-hidden="true">into</div>

                <article class="trackcard targetcard">
                    <label class="dropzone targetdrop">
                        <span>to recreate:</span>
                        <input class="targetfile fileinput" type="file" accept="audio/*">
                    </label>
                    <div class="trackmeta targetmeta hidden" hidden>
                        <canvas class="targetwave waveform" aria-hidden="true"></canvas>
                        <div class="fileline">
                            <span class="targetfilename filename"></span>
                            <button class="clearbutton cleartarget" type="button">remove</button>
                        </div>
                        <span class="targetdetail trackdetail"></span>
                        <audio class="targetplayer trackplayer" controls preload="metadata"></audio>
                    </div>
                </article>
            </section>

            <section class="settings">
                <div class="settingshead">
                    <h2 class="sectiontitle">settings</h2>
                </div>

                <div class="controlgrid">
                    <label class="control">
                        <span class="controltop"><span>slice length</span><output class="framereadout readout">40 ms</output></span>
                        <input class="framelength rangeinput" type="range" min="20" max="120" step="5" value="40">
                    </label>
                    <label class="control">
                        <span class="controltop"><span>overlap</span><output class="overlapreadout readout">50%</output></span>
                        <input class="overlap rangeinput" type="range" min="0" max="75" step="5" value="50">
                        <span class="controlhint">fills gaps and softens joins (recommended)</span>
                    </label>
                    <label class="control">
                        <span class="controltop"><span>frequency focus</span><output class="focusreadout readout">neutral</output></span>
                        <input class="frequencyfocus rangeinput" type="range" min="-100" max="100" step="10" value="0">
                        <span class="controlhint">bias towards lower or higher spectral bands</span>
                    </label>
                    <label class="control">
                        <span class="controltop"><span>repeat avoidance</span><output class="repeatsreadout readout">off</output></span>
                        <input class="repeatavoid rangeinput" type="range" min="0" max="100" step="10" value="0">
                        <span class="controlhint">don't use the same slice too often</span>
                    </label>
                </div>

                <details class="advanced">
                    <summary>advanced..</summary>
                    <div class="advancedgrid">
                        <label class="control">
                            <span class="controltop"><span>smoothness</span><output class="smoothreadout readout">off</output></span>
                            <input class="smoothness rangeinput" type="range" min="0" max="100" step="10" value="0">
                        </label>
                        <label class="control selectcontrol">
                            <span class="controltop"><span>analysis quality</span></span>
                            <select class="quality">
                                <option value="22050">22.05 kHz</option>
                                <option value="44100" selected>44.1 kHz</option>
                            </select>
                        </label>
                        <label class="checkcontrol">
                            <input class="matchloudness checkinput" type="checkbox" checked>
                            <span><strong class="checktitle">match target loudness</strong></span>
                        </label>
                    </div>
                </details>

                <div class="actionrow">
                    <button class="mixbutton" type="button" disabled>generate!</button>
                    <button class="cancelbutton hidden" type="button" hidden>cancel</button>
                    <span class="status hidden" role="status" aria-live="polite" hidden></span>
                </div>
                <progress class="progress hidden" value="0" max="100" hidden></progress>
            </section>

            <section class="result hidden" hidden>
                <div class="resulthead">
                    <h2 class="sectiontitle">Your mix</h2>
                    <a class="downloadbutton" download="sentence-mix.wav">download wav</a>
                </div>
                <canvas class="resultwave waveform" aria-hidden="true"></canvas>
                <audio class="resultplayer" controls preload="metadata"></audio>
            </section>

        </main>
    </div>

    <script src="index.js"></script>

</body>
</html>
