<!doctype html>
<html lang="en">
<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>gifski</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2036%2036%22%3E%3Cpath%20d%3D%22M29%2011h6v14h-6zM1%2011h6v14H1zm8%200h18v14H9z%22%20fill%3D%22%23BBDDF5%22%2F%3E%3Cpath%20fill%3D%22%23231F20%22%20d%3D%22M35%2011V6H1v5h6v14h-6V11h6zm-8%2014H9V11h18v14z%22%2F%3E%3Cpath%20fill%3D%22%23F5F8FA%22%20d%3D%22M31%207h2v3h-2zm-4%200h2v3h-2zm-4%200h2v3h-2zm-4%200h2v3h-2zm-4%200h2v3h-2zm-4%200h2v3H7zm-4%200h2v3H3zm28%2019h2v3h-2zm-4%200h2v3h-2zm-4%200h2v3h-2zm-4%200h2v3h-2zm-4%200h2v3h-2zm-4%200h2v3h-2zm-4%200h2v3H7zm-4%200h2v3H3z%22%2F%3E%3Cpath%20fill%3D%22%2388C9F9%22%20d%3D%22M29%2025V11h1v14zM9%2025V11h1v14z%22%2F%3E%3C%2Fsvg%3E">

    <link rel="stylesheet" href="base.css">
    <style>

        .controls {
            max-width: 760px;
        }
        .form {display: grid; gap: 0.75em}

        /*//////////////////////////////////////////////////////////////////////*/

        .optiongroup {
            min-width: 0; margin: 0;
            border: 0; border-bottom: 1px solid #c7d0d9;
            padding: 0 0 0.75em;
        }
        .optiontitle {
            color: #394b5b; padding: 0 0.25em;
            font-weight: 700;
        }
        .optionrow {
            display: flex; flex-wrap: wrap;
            align-items: center; gap: 0.7em 1.2em;
        }
        .optionrow + .optionrow {
            margin-top: 0.7em;
        }

        /*//////////////////////////////////////////////////////////////////////*/

        .automatic {
            color: #39546d; white-space: nowrap;
        }
        .actionrow {
            display: flex; flex-wrap: wrap;
            align-items: center; gap: 0.7em 1em;
        }
        .preview {
            margin-top: 0.75em;
        }
        .previewmedia {
            display: block; max-width: 100%;
            background: #000000;
        }
        .adjustmentstage {
            position: relative; display: inline-block;
            max-width: 100%; background: #000000;
        }
        .adjustmentstage .previewmedia {max-width: 100%}
        .cropcontrols {
            position: absolute; top: 0.6em;
            right: 0.6em; z-index: 3;
            display: flex; gap: 0.45em;
            max-width: calc(100% - 1.2em);
        }
        .cropcontrols select {
            min-width: 0; max-width: 15em;
            color: #000000; background: #ffffff;
        }
        .cropoverlay {
            position: absolute; inset: 0;
            pointer-events: none;
        }
        .cropbox {
            position: absolute; display: none;
            border: 2px solid #ffffff;
            box-shadow: 0 0 0 9999px rgba(0,0,0,0.56);
            pointer-events: none;
        }
        .cropbox.active {display: block}
        .trimeditor {
            margin: 0;
        }
        .trimtimeline {
            position: relative; height: 2.5em;
            margin: 0; overflow: hidden;
            border: 1px solid #000000; background: #ffffff;
        }
        .trimtimeline.trimdisabled {
            opacity: 0.5; filter: grayscale(1);
            cursor: not-allowed;
        }
        .trimcontrols.trimdisabled {opacity: 0.5}
        .trimselected {
            position: absolute; top: 0;
            bottom: 0; background: #ffffff;
        }
        .trimexcluded {
            position: absolute; top: 0;
            bottom: 0; z-index: 2;
            border: 0; padding: 0;
            background: rgba(0,0,0,0.72); cursor: pointer;
        }
        .trimplayhead {
            position: absolute; top: 0;
            bottom: 0; z-index: 4;
            width: 2px; background: #000000;
            pointer-events: none;
        }
        .trimslider {
            position: absolute; top: 0;
            left: 0; z-index: 5;
            width: 100%; height: 100%;
            margin: 0; appearance: none;
            background: transparent; pointer-events: none;
        }
        .trimslider::-webkit-slider-thumb {
            width: 1.1em; height: 2.5em;
            border: 1px solid #000000; border-radius: 0;
            background: #ffffff; cursor: ew-resize;
            appearance: none; pointer-events: auto;
        }
        .trimlabels {
            display: flex; justify-content: space-between;
            gap: 0.75em; margin-top: 0.3em;
        }
        .trimtime {
            width: 8.6em; border: 1px solid #000000;
            color: #000000; background: #ffffff;
            font: inherit; text-align: center;
        }
        .fullvideocontrol {margin-top: 0.55em}

        /*//////////////////////////////////////////////////////////////////////*/

        .status {color: #52616e; font-size: 0.9em}
        .output {
            margin-top: 0.75em; font-family: monospace;
        }
        .progresspanel {
            margin-top: 0.75em;
        }
        .progressheader {
            display: flex; justify-content: space-between;
            gap: 1em;
        }
        .progressbar {width: 100%; margin-top: 0.45em}
        .progressdetails {margin-top: 0.45em; white-space: pre-wrap}
        .warning {color: #985500; font-size: 0.9em}

    </style>

</head>
<body>
    <h2>gifski</h2>
    <div class="controls">
        <form class="form" id="form">
            <fieldset class="optiongroup">
                <legend class="optiontitle">source</legend>
                <div class="optionrow">
                    <label>video <input class="videoinput" type="file" id="videofile" accept="video/*"></label>
                    <span class="hint" id="filesize"></span>
                </div>
            </fieldset>
            <fieldset class="optiongroup">
                <legend class="optiontitle">output</legend>
                <div class="optionrow">
                    <label>fps <input type="number" id="fps" min="1" max="50" value="24"></label>
                    <label class="automatic"><input type="checkbox" id="autofps"> choose a safe fps</label>
                    <label><input type="checkbox" id="loop" checked> loop GIF</label>
                </div>
            </fieldset>
            <fieldset class="optiongroup">
                <legend class="optiontitle">compression</legend>
                <div class="optionrow">
                    <label>max size <input type="number" id="limit" min="0.1" step="0.1" value="9">MB</label>
                    <label class="automatic"><input type="checkbox" id="autolimit" checked> fit the size limit</label>
                </div>
            </fieldset>
            <fieldset class="optiongroup">
                <legend class="optiontitle">presets and conversion</legend>
                <div class="optionrow">
                    <button class="btn" id="widepreset" type="button">profile banner preset</button>
                    <button class="btn" id="smallpreset" type="button">small size preset</button>
                </div>
                <div class="actionrow">
                    <button class="btn" id="convert" type="button">convert</button>
                    <button class="btn" id="stop" type="button" disabled>stop</button>
                    <span class="status" id="status"></span>
                </div>
                <div class="hint" id="estimate"></div>
                <p class="warning" id="warning"></p>
            </fieldset>
        </form>
        <div class="progresspanel" id="progresspanel" hidden>
            <div class="progressheader"><strong id="progresstitle">preparing conversion</strong><span id="progresspercent">0%</span></div>
            <progress class="progressbar" id="progressbar" max="100" value="0"></progress>
            <div class="hint progressdetails" id="progressdetails"></div>
        </div>
        <div class="preview" id="preview" hidden>
            <div class="videostage" id="videostage"></div>
            <section class="trimeditor" id="trimeditor" aria-label="video trim" hidden>
                <div class="trimtimeline" id="trimtimeline" aria-label="selected video range">
                    <div class="trimselected" id="trimselected"></div>
                    <button class="trimexcluded" id="trimleft" type="button" aria-label="play from trim start"></button>
                    <button class="trimexcluded" id="trimright" type="button" aria-label="play before trim end"></button>
                    <div class="trimplayhead" id="trimplayhead"></div>
                    <input class="trimslider" type="range" id="trimstart" min="0" max="0" step="0.001" value="0" aria-label="trim start">
                    <input class="trimslider" type="range" id="trimend" min="0" max="0" step="0.001" value="0" aria-label="trim end">
                </div>
                <div class="trimlabels trimcontrols" id="trimcontrols">
                    <input class="trimtime" type="text" id="starttime" value="00:00:00:000" inputmode="text" aria-label="trim start time">
                    <input class="trimtime" type="text" id="endtime" value="00:00:00:000" inputmode="text" aria-label="trim end time">
                </div>
                <label class="fullvideocontrol"><input type="checkbox" id="fullduration" checked> full video</label>
                <input type="hidden" id="start" value="0">
                <input type="hidden" id="end" value="0">
                <input type="hidden" id="duration" value="3">
            </section>
        </div>
        <div class="output" id="output" hidden></div>
    </div>

    <script type="module">
        import {rungifsiclewithprogress} from "../assets/static/js/gifsicle/gifsicleprogress.js";

        const videofile = document.querySelector("#videofile");
        const filesize = document.querySelector("#filesize");
        const convert = document.querySelector("#convert");
        const stopbutton = document.querySelector("#stop");
        const status = document.querySelector("#status");
        const preview = document.querySelector("#preview");
        const videostage = document.querySelector("#videostage");
        const trimeditor = document.querySelector("#trimeditor");
        const trimcontrols = document.querySelector("#trimcontrols");
        const output = document.querySelector("#output");
        const progresspanel = document.querySelector("#progresspanel");
        const progresstitle = document.querySelector("#progresstitle");
        const progresspercent = document.querySelector("#progresspercent");
        const progressbar = document.querySelector("#progressbar");
        const progressdetails = document.querySelector("#progressdetails");
        const estimate = document.querySelector("#estimate");
        const warning = document.querySelector("#warning");
        const startinput = document.querySelector("#start");
        const endinput = document.querySelector("#end");
        const durationinput = document.querySelector("#duration");
        const starttimeinput = document.querySelector("#starttime");
        const endtimeinput = document.querySelector("#endtime");
        const fulldurationinput = document.querySelector("#fullduration");
        const trimstartinput = document.querySelector("#trimstart");
        const trimendinput = document.querySelector("#trimend");
        const trimselected = document.querySelector("#trimselected");
        const trimleft = document.querySelector("#trimleft");
        const trimright = document.querySelector("#trimright");
        const trimplayhead = document.querySelector("#trimplayhead");
        const fpsinput = document.querySelector("#fps");
        const autofpsinput = document.querySelector("#autofps");
        const loopinput = document.querySelector("#loop");
        const limitinput = document.querySelector("#limit");
        const autolimitinput = document.querySelector("#autolimit");
        const widepreset = document.querySelector("#widepreset");
        const smallpreset = document.querySelector("#smallpreset");
        const automaticmemorybudget = 1024 * 1024 * 1024;
        const resolutionpresets = [
            {name: "144p", width: 256, height: 144, ratio: "16:9"},
            {name: "180p", width: 320, height: 180, ratio: "16:9"},
            {name: "240p", width: 426, height: 240, ratio: "16:9"},
            {name: "360p", width: 640, height: 360, ratio: "16:9"},
            {name: "480p", width: 854, height: 480, ratio: "16:9"},
            {name: "540p", width: 960, height: 540, ratio: "16:9"},
            {name: "720p HD", width: 1280, height: 720, ratio: "16:9"},
            {name: "1080p Full HD", width: 1920, height: 1080, ratio: "16:9"},
            {name: "1440p QHD", width: 2560, height: 1440, ratio: "16:9"},
            {name: "2160p 4K UHD", width: 3840, height: 2160, ratio: "16:9"},
            {name: "CGA", width: 320, height: 240, ratio: "4:3"},
            {name: "VGA", width: 640, height: 480, ratio: "4:3"},
            {name: "SVGA", width: 800, height: 600, ratio: "4:3"},
            {name: "XGA", width: 1024, height: 768, ratio: "4:3"},
            {name: "SXGA", width: 1280, height: 960, ratio: "4:3"},
            {name: "WXGA", width: 1280, height: 800, ratio: "16:10"},
            {name: "UWHD", width: 2560, height: 1080, ratio: "21:9"},
            {name: "DQHD", width: 5120, height: 1440, ratio: "32:9"},
            {name: "Square", width: 320, height: 320, ratio: "1:1"},
            {name: "Square", width: 640, height: 640, ratio: "1:1"},
            {name: "Square", width: 1080, height: 1080, ratio: "1:1"},
            {name: "Vertical SD", width: 240, height: 426, ratio: "9:16"},
            {name: "Vertical HD", width: 720, height: 1280, ratio: "9:16"},
            {name: "Vertical Full HD", width: 1080, height: 1920, ratio: "9:16"},
            {name: "Banner", width: 690, height: 90, ratio: "69:9"},
        ];
        const cropratios = ["source", "1:1", "4:5", "5:4", "2:3", "3:2", "3:4", "4:3", "9:16", "16:9", "16:10", "18:9", "19.5:9", "21:9", "32:9", "69:9"];

        let fileurl = null;
        let outputurl = null;
        let encoderworker = null;
        let cancelencoding = null;
        let running = false;
        let progressstage = "preparing conversion";
        let conversionstarted = 0;
        let cropstate = null;
        let selectedresolution = "";

        /*//////////////////////////////////////////////////////////////////////*/

        videofile.addEventListener("change", ()=>{
            const file = videofile.files[0];
            filesize.textContent = file ? ` (${formatbytes(file.size)})` : "";
            if (fileurl) URL.revokeObjectURL(fileurl);
            fileurl = file ? URL.createObjectURL(file) : null;
            cropstate = null;
            selectedresolution = "";
            if (outputurl) URL.revokeObjectURL(outputurl);
            outputurl = null;
            output.replaceChildren();
            output.hidden = true;
            progresspanel.hidden = true;
            showvideo();
            updateestimate();
        });

        [autofpsinput].forEach(input=>{
            input.addEventListener("change", ()=>{
                syncautomaticinputs();
                updateestimate();
            });
        });

        widepreset.addEventListener("click", ()=>{
            fpsinput.value = 24;
            limitinput.value = 9;
            autofpsinput.checked = false;
            autolimitinput.checked = true;
            applycropratio("69:9");
            selectresolution("690x90");
            syncautomaticinputs();
            updateestimate();
        });

        smallpreset.addEventListener("click", ()=>{
            fpsinput.value = 12;
            limitinput.value = 3;
            autofpsinput.checked = false;
            autolimitinput.checked = true;
            applycropratio("16:9");
            selectresolution("426x240");
            syncautomaticinputs();
            updateestimate();
        });

        fulldurationinput.addEventListener("change", ()=>{
            syncfullrange();
            updateestimate();
        });

        starttimeinput.addEventListener("change", ()=>syncmanualrange("start"));
        endtimeinput.addEventListener("change", ()=>syncmanualrange("end"));
        [starttimeinput, endtimeinput].forEach(input=>{
            input.addEventListener("keydown", event=>{
                if (event.key !== "Enter") return;
                event.preventDefault();
                input.blur();
            });
        });
        trimstartinput.addEventListener("input", ()=>syncsliderrange("start"));
        trimendinput.addEventListener("input", ()=>syncsliderrange("end"));
        trimleft.addEventListener("click", ()=>playtrimedge("start"));
        trimright.addEventListener("click", ()=>playtrimedge("end"));

        [fpsinput, limitinput, autolimitinput].forEach(input=>{
            input.addEventListener("input", updateestimate);
            input.addEventListener("change", updateestimate);
        });

        stopbutton.addEventListener("click", ()=>{
            running = false;
            if (cancelencoding) cancelencoding();
            else if (encoderworker) encoderworker.terminate();
            encoderworker = null;
            setprogress(Number(progressbar.value), "conversion stopped", "no output was created.");
            status.textContent = "stopped";
            stopbutton.disabled = true;
            convert.disabled = false;
        });

        /*//////////////////////////////////////////////////////////////////////*/

        convert.addEventListener("click", async ()=>{
            if (running) return;
            const sourcevideo = videostage.querySelector("video");
            if (!sourcevideo || !fileurl) {
                status.textContent = "pick a video first";
                return;
            }

            let settings = readsettings(sourcevideo);
            if (!settings) return;
            setrunning(true);
            output.replaceChildren();
            output.hidden = true;
            warning.textContent = "";
            conversionstarted = performance.now();
            setprogress(0, "preparing conversion", progresssettings(settings));

            try {
                while (running) {
                    const frames = await captureframes(sourcevideo, settings);
                    if (!running) return;
                    const gif = await encodegif(frames, settings);
                    if (!running) return;
                    setprogress(0, "checking output size", `${formatbytes(gif.size)} before size fitting.`);
                    const result = await fitlimit(gif, settings);
                    if (!running) return;
                    if (result.file.size <= settings.limit || !settings.autolimit) {
                        showoutput(result.file, settings, result.loss);
                        if (result.file.size > settings.limit) warning.textContent = `${formatbytes(result.file.size)} is over the ${formatbytes(settings.limit)} limit. Choose a smaller resolution, lower fps, or a shorter range.`;
                        break;
                    }
                    const fallback = nextfittingresolution(settings);
                    if (!fallback) {
                        showoutput(result.file, settings, result.loss);
                        warning.textContent = `${formatbytes(result.file.size)} is over the ${formatbytes(settings.limit)} limit. Choose a smaller resolution, lower fps, or a shorter range.`;
                        break;
                    }
                    settings = {...settings, width: fallback.width, height: fallback.height, resolution: presetkey(fallback)};
                    syncresolutionselection(fallback);
                    setprogress(0, "trying a smaller resolution", `${fallback.width}x${fallback.height} at ${settings.fps}fps.`);
                }
                if (!running) return;
                const resulttext = output.textContent.match(/[\d.]+ MB/)?.[0] || "GIF";
                setprogress(100, "conversion complete", `${resulttext} created in ${formattime(performance.now() - conversionstarted)}.`);
                status.textContent = "done";
            } catch (error) {
                if (running) {
                    const message = friendlyerror(error, settings);
                    const failedstage = progressstage;
                    setprogress(Number(progressbar.value), "conversion failed", `failed while ${failedstage}.\n${message}`);
                    showfailure(new Error(message), settings, failedstage);
                    status.textContent = `failed while ${failedstage}`;
                }
            } finally {
                if (running) setrunning(false);
            }
        });

        /*//////////////////////////////////////////////////////////////////////*/

        function showvideo(){
            videostage.replaceChildren();
            preview.hidden = !fileurl;
            trimeditor.hidden = true;
            if (!fileurl) return;
            const stage = document.createElement("div");
            stage.className = "adjustmentstage";
            const video = document.createElement("video");
            video.className = "previewmedia";
            video.controls = true;
            video.muted = true;
            video.playsInline = true;
            video.preload = "metadata";
            video.src = fileurl;
            video.addEventListener("timeupdate", ()=>{
                restricttotrim(video);
                updateplayhead(video);
            });
            video.addEventListener("seeking", ()=>restricttotrim(video));
            video.addEventListener("seeked", ()=>updateplayhead(video));
            const controls = document.createElement("div");
            controls.className = "cropcontrols";
            const resolutionselect = document.createElement("select");
            resolutionselect.setAttribute("aria-label", "GIF resolution");
            const aspectselect = document.createElement("select");
            aspectselect.setAttribute("aria-label", "crop aspect ratio");
            for (const ratio of cropratios) {
                const option = document.createElement("option");
                option.value = ratio;
                option.textContent = ratio === "source" ? "remove crop" : ratio;
                aspectselect.append(option);
            }
            controls.append(resolutionselect, aspectselect);
            const overlay = document.createElement("div");
            overlay.className = "cropoverlay";
            const cropbox = document.createElement("div");
            cropbox.className = "cropbox";
            overlay.append(cropbox);
            stage.append(video, overlay, controls);
            videostage.append(stage);
            video.addEventListener("loadedmetadata", ()=>{
                setuptrim(video);
                setupcrop(video, resolutionselect, aspectselect, cropbox);
            }, {once: true});
        }

        function setupcrop(video, resolutionselect, aspectselect, cropbox){
            const sourceratio = video.videoWidth / video.videoHeight;
            const initialratio = closestcropratio(sourceratio);
            populateaspectoptions(aspectselect, initialratio);
            updateresolutions(resolutionselect, rationumber(initialratio));
            selectresolutionchoice(resolutionselect, initialratio);
            resolutionselect.addEventListener("change", ()=>{
                const preset = resolutionpreset(resolutionselect.value);
                if (!preset) return;
                selectedresolution = presetkey(preset);
                aspectselect.value = preset.ratio;
                cropstate = centeredcrop(preset.ratio, sourceratio);
                updatecropbox(cropbox);
                updateestimate();
            });
            aspectselect.addEventListener("change", ()=>{
                const ratio = aspectselect.value;
                if (ratio === "source") {
                    cropstate = null;
                    updateresolutions(resolutionselect, sourceratio);
                } else {
                    cropstate = centeredcrop(ratio, sourceratio);
                    updateresolutions(resolutionselect, rationumber(ratio));
                }
                selectresolutionchoice(resolutionselect, ratio === "source" ? sourceratio : rationumber(ratio));
                updatecropbox(cropbox);
                updateestimate();
            });
            let dragstart = null;
            video.addEventListener("pointerdown", event=>{
                const bounds = video.getBoundingClientRect();
                if (event.clientY > bounds.bottom - 44 || event.target !== video) return;
                const ratio = aspectselect.value === "source" ? sourceratio : rationumber(aspectselect.value);
                dragstart = cropcoordinate(event, bounds);
                video.setPointerCapture(event.pointerId);
                cropstate = cropfromdrag(dragstart, dragstart, ratio);
                updatecropbox(cropbox);
            });
            video.addEventListener("pointermove", event=>{
                if (!dragstart) return;
                const bounds = video.getBoundingClientRect();
                const ratio = aspectselect.value === "source" ? sourceratio : rationumber(aspectselect.value);
                cropstate = cropfromdrag(dragstart, cropcoordinate(event, bounds), ratio);
                updatecropbox(cropbox);
                event.preventDefault();
            });
            const finishdrag = event=>{
                if (!dragstart) return;
                dragstart = null;
                if (cropstate && (cropstate.width < 2 || cropstate.height < 2)) cropstate = null;
                else if (cropstate) {
                    const ratio = cropstate.width / cropstate.height;
                    const closest = closestcropratio(ratio);
                    aspectselect.value = closest;
                    updateresolutions(resolutionselect, ratio);
                    selectresolutionchoice(resolutionselect, ratio);
                }
                updatecropbox(cropbox);
                updateestimate();
                if (video.hasPointerCapture(event.pointerId)) video.releasePointerCapture(event.pointerId);
            };
            video.addEventListener("pointerup", finishdrag);
            video.addEventListener("pointercancel", finishdrag);
            updatecropbox(cropbox);
        }

        function populateaspectoptions(select, initialratio){
            const closest = closestcropratio(initialratio);
            select.value = cropstate ? closest : "source";
        }

        function updateresolutions(select, ratio){
            const matches = resolutionpresets.filter(preset=>Math.abs(preset.width / preset.height - ratio) < 0.02);
            const options = matches.length ? matches : [...resolutionpresets].sort((first, second)=>Math.abs(first.width / first.height - ratio) - Math.abs(second.width / second.height - ratio)).slice(0, 8);
            select.replaceChildren();
            for (const preset of options) {
                const option = document.createElement("option");
                option.value = presetkey(preset);
                option.textContent = `${preset.name} - ${preset.width}x${preset.height} - ${preset.ratio}`;
                select.append(option);
            }
        }

        function selectresolutionchoice(select, ratio){
            const options = [...select.options];
            const selected = options.find(option=>option.value === selectedresolution);
            const standard = options.find(option=>option.value === "640x360") || options.find(option=>option.value === "426x240") || options[0];
            const choice = selected || standard;
            if (!choice) return;
            select.value = choice.value;
            selectedresolution = choice.value;
        }

        function selectresolution(key){
            selectedresolution = key;
            const select = videostage.querySelector(".cropcontrols select");
            if (!select) return;
            select.value = key;
            select.dispatchEvent(new Event("change"));
        }

        function applycropratio(ratio){
            const selects = videostage.querySelectorAll(".cropcontrols select");
            const video = videostage.querySelector("video");
            if (!video || selects.length < 2) return;
            selects[1].value = ratio;
            selects[1].dispatchEvent(new Event("change"));
        }

        function resolutionpreset(key){
            return resolutionpresets.find(preset=>presetkey(preset) === key);
        }

        function presetkey(preset){
            return `${preset.width}x${preset.height}`;
        }

        function rationumber(ratio){
            const values = String(ratio).split(":").map(Number);
            return values.length === 2 && values[0] > 0 && values[1] > 0 ? values[0] / values[1] : 16 / 9;
        }

        function closestcropratio(ratio){
            return cropratios.filter(value=>value !== "source").sort((first, second)=>Math.abs(rationumber(first) - ratio) - Math.abs(rationumber(second) - ratio))[0];
        }

        function centeredcrop(ratio, sourceratio){
            const targetratio = typeof ratio === "number" ? ratio : rationumber(ratio);
            if (targetratio >= sourceratio) {
                const height = sourceratio / targetratio * 100;
                return {left: 0, top: (100 - height) / 2, width: 100, height};
            }
            const width = targetratio / sourceratio * 100;
            return {left: (100 - width) / 2, top: 0, width, height: 100};
        }

        function cropcoordinate(event, bounds){
            return {
                x: Math.max(0, Math.min(100, (event.clientX - bounds.left) / bounds.width * 100)),
                y: Math.max(0, Math.min(100, (event.clientY - bounds.top) / bounds.height * 100)),
            };
        }

        function cropfromdrag(start, end, ratio){
            const horizontal = end.x >= start.x ? 1 : -1;
            const vertical = end.y >= start.y ? 1 : -1;
            let width = Math.min(Math.abs(end.x - start.x), Math.abs(end.y - start.y) * ratio);
            let height = width / ratio;
            let left = horizontal > 0 ? start.x : start.x - width;
            let top = vertical > 0 ? start.y : start.y - height;
            if (left < 0) {
                width += left;
                height = width / ratio;
                left = 0;
            }
            if (top < 0) {
                height += top;
                width = height * ratio;
                top = 0;
            }
            if (left + width > 100) {
                width = 100 - left;
                height = width / ratio;
            }
            if (top + height > 100) {
                height = 100 - top;
                width = height * ratio;
            }
            return {left, top, width, height};
        }

        function updatecropbox(cropbox){
            cropbox.classList.toggle("active", Boolean(cropstate));
            if (!cropstate) return;

        function setuptrim(video){

        function syncfullrange(){

        function syncmanualrange(changed){

            if (changed === "start" && start >= end) end = Math.min(duration, start + 0.001);

        function syncsliderrange(changed){
            const video = videostage.querySelector("video");
            if (!video || !Number.isFinite(video.duration)) return;
            fulldurationinput.checked = false;
            const duration = video.duration;
            let start = numbervalue(trimstartinput, 0, 0, duration);
            let end = numbervalue(trimendinput, duration, 0, duration);
            if (changed === "start" && start >= end) start = Math.max(0, end - 0.001);
            if (changed === "end" && end <= start) end = Math.min(duration, start + 0.001);
            startinput.value = start.toFixed(3);
            endinput.value = end.toFixed(3);
            synctrimdisplay(duration);
            restricttotrim(video);
            previewtrimhandle(video, changed);
            updateestimate();
        }

        function synctrimdisplay(duration){
            let start = numbervalue(startinput, 0, 0, duration);
            let end = numbervalue(endinput, duration, 0, duration);
            if (fulldurationinput.checked) {
                start = 0;
                end = duration;
            }
            if (end <= start) end = Math.min(duration, start + 0.001);
            startinput.value = start.toFixed(3);
            endinput.value = end.toFixed(3);
            trimstartinput.value = start;
            trimendinput.value = end;
            durationinput.value = Math.max(0.001, end - start).toFixed(3);
            const startpercent = duration ? start / duration * 100 : 0;
            const endpercent = duration ? end / duration * 100 : 100;
            trimleft.style.left = "0";
            trimleft.style.width = `${startpercent}%`;
            trimselected.style.left = `${startpercent}%`;
            trimselected.style.width = `${Math.max(0, endpercent - startpercent)}%`;
            trimright.style.left = `${endpercent}%`;
            trimright.style.right = "0";
            starttimeinput.value = formattimestamp(start);
            endtimeinput.value = formattimestamp(end);
        }

        function updateplayhead(video){
            const duration = Number.isFinite(video.duration) ? video.duration : 0;
            const percent = duration ? Math.min(100, Math.max(0, video.currentTime / duration * 100)) : 0;
            trimplayhead.style.left = `${percent}%`;
        }

        function previewtrimhandle(video, changed){
            const start = numbervalue(startinput, 0, 0, video.duration);
            const end = numbervalue(endinput, video.duration, 0, video.duration);
            const time = changed === "start" ? start : Math.max(start, end - 1);
            video.currentTime = time;
            video.play().catch(()=>{});
        }

        function playtrimedge(changed) {
            const video = videostage.querySelector("video");
            if (!video || fulldurationinput.checked) return;
            previewtrimhandle(video, changed);
        }

        function restricttotrim(video){
            if (fulldurationinput.checked || !Number.isFinite(video.duration)) return;
            const start = numbervalue(startinput, 0, 0, video.duration);
            const end = numbervalue(endinput, video.duration, 0, video.duration);
            if (video.currentTime >= start && video.currentTime < end) return;
            if (Math.abs(video.currentTime - start) < 0.001) return;
            video.currentTime = start;
        }

        function syncautomaticinputs(){
            fpsinput.disabled = autofpsinput.checked;
        }

        function updateestimate(){
            const video = videostage.querySelector("video");
            const duration = video && Number.isFinite(video.duration) ? selectedduration(video) : numbervalue(durationinput, 3, 0.001);
            const resolution = currentresolution();
            const settings = resolveautosettings({
                duration,
                fps: numbervalue(fpsinput, 24, 1, 50),
                width: resolution.width,
                height: resolution.height,
                limit: numbervalue(limitinput, 9, 0.1) * 1000000,
                autofps: autofpsinput.checked,
            });
            const framecount = Math.max(2, Math.floor(settings.duration * settings.fps));
            const memory = framecount * settings.width * settings.height * 4;
            estimate.textContent = `${framecount} frames at ${settings.width}x${settings.height}.`;
            warning.textContent = memory > automaticmemorybudget ? memorymessage(settings, memory) : "";
        }

        function readsettings(video){
            const start = numbervalue(startinput, 0, 0, video.duration);
            const end = fulldurationinput.checked ? video.duration : numbervalue(endinput, video.duration, 0, video.duration);
            const duration = end - start;
            if (!Number.isFinite(duration) || duration <= 0) {
                status.textContent = "the trim range has no video";
                return null;
            }
            const resolution = currentresolution();
            const settings = resolveautosettings({
                duration,
                fps: numbervalue(fpsinput, 24, 1, 50),
                width: resolution.width,
                height: resolution.height,
                limit: numbervalue(limitinput, 9, 0.1) * 1000000,
                autofps: autofpsinput.checked,
            });
            const memory = estimateframememory(settings);
            if (memory > automaticmemorybudget) {
                const message = memorymessage(settings, memory);
                warning.textContent = message;
                return null;
            }
            return {
                ...settings,
                start,
                duration,
                crop: sourcecrop(video),
                resolution: presetkey(resolution),
                loop: loopinput.checked,
                autolimit: autolimitinput.checked,
                maxloss: 200,
            };
        }

        function resolveautosettings(settings){
            const automatic = [];
            let fps = settings.fps;
            if (settings.autofps) {
                fps = findautomaticfps(settings.width, settings.height, settings.duration);
                automatic.push(`${fps}fps`);
            }
            return {...settings, fps, quality: 100, automatic};
        }

        function findautomaticfps(width, height, duration){
            const allowedfps = [50, 48, 40, 36, 30, 24, 20, 18, 15, 12, 10, 8, 6, 5, 4, 3, 2, 1];
            const maximum = findmaximumfps(width, height, duration);
            return allowedfps.find(value=>value <= maximum) || 1;
        }

        function findmaximumfps(width, height, duration){
            return Math.max(1, Math.floor(automaticmemorybudget / (Math.max(0.001, duration) * width * height * 4)));
        }

        function currentresolution(){
            return resolutionpreset(selectedresolution) || resolutionpresets.find(preset=>presetkey(preset) === "640x360") || resolutionpresets[0];
        }

        function nextfittingresolution(settings){
            const ratio = settings.width / settings.height;
            const currentpixels = settings.width * settings.height;
            return resolutionpresets
                .filter(preset=>Math.abs(preset.width / preset.height - ratio) < 0.02 && preset.width * preset.height < currentpixels)
                .sort((first, second)=>second.width * second.height - first.width * first.height)[0] || null;
        }

        function syncresolutionselection(preset){
            selectedresolution = presetkey(preset);
            const select = videostage.querySelector(".cropcontrols select");
            if (select && [...select.options].some(option=>option.value === selectedresolution)) select.value = selectedresolution;
        }

        function sourcecrop(video){
            if (!cropstate) return null;
            return {
                x: cropstate.left / 100 * video.videoWidth,
                y: cropstate.top / 100 * video.videoHeight,
                width: cropstate.width / 100 * video.videoWidth,
                height: cropstate.height / 100 * video.videoHeight,
            };
        }

        function estimateframememory(settings){
            return Math.max(2, Math.floor(settings.duration * settings.fps)) * settings.width * settings.height * 4;
        }

        function memorymessage(settings, memory){
            return `${settings.width}x${settings.height} at ${settings.fps}fps needs about ${formatbytes(memory)} before conversion. Choose a smaller resolution, lower fps, or a shorter range.`;
        }

        function selectedduration(video){
            if (fulldurationinput.checked) return video.duration;
            return Math.max(0.001, numbervalue(endinput, video.duration, 0, video.duration) - numbervalue(startinput, 0, 0, video.duration));
        }

        function numbervalue(input, fallback, minimum, maximum){
            let value = Number(input.value);
            if (!Number.isFinite(value)) value = fallback;
            if (minimum !== undefined) value = Math.max(minimum, value);
            if (maximum !== undefined) value = Math.min(maximum, value);
            return value;
        }

        function timestampvalue(input, fallback, minimum, maximum) {
            const match = input.value.trim().match(/^(\d+):([0-5]?\d):([0-5]?\d):(\d{1,3})$/);
            if (!match) return fallback;
            let value = Number(match[1]) * 3600 + Number(match[2]) * 60 + Number(match[3]) + Number(match[4].padEnd(3, "0")) / 1000;
            if (!Number.isFinite(value)) value = fallback;
            if (minimum !== undefined) value = Math.max(minimum, value);
            if (maximum !== undefined) value = Math.min(maximum, value);
            return value;
        }

        async function captureframes(video, settings){
            const memory = estimateframememory(settings);
            if (memory > automaticmemorybudget) throw new Error(memorymessage(settings, memory));
            const canvas = document.createElement("canvas");
            canvas.width = settings.width;
            canvas.height = settings.height;
            const context = canvas.getContext("2d", {willReadFrequently: true});
            const framecount = Math.max(2, Math.floor(settings.duration * settings.fps));
            const framebytes = settings.width * settings.height * 4;
            const frames = new Uint8Array(framecount * framebytes);
            let captured = 0;
            const updatecaptureprogress = ()=>{
                const percent = Math.round(captured / framecount * 100);
                setprogress(percent, "sampling video frames", `${captured}/${framecount} frames - ${settings.width}x${settings.height} at ${settings.fps}fps.`);
            };

            const addframe = ()=>{
                drawframe(context, video, settings);
                frames.set(context.getImageData(0, 0, settings.width, settings.height).data, captured * framebytes);
                captured += 1;
                if (captured === framecount || captured % Math.max(1, Math.ceil(framecount / 100)) === 0) updatecaptureprogress();
            };

            await seekvideo(video, settings.start);
            addframe();
            if (captured < framecount) {
                await seekvideo(video, settings.start + captured / settings.fps);
                await captureplayingframes(video, settings, framecount, addframe, ()=>captured);
            }
            await captureexactframes(video, settings, framecount, captured, addframe);

            if (!running) throw new Error("stopped");
            if (captured !== framecount) throw new Error("the video did not provide every requested frame");
            return frames.buffer;
        }

        async function captureplayingframes(video, settings, framecount, addframe, capturedframes){
            if (typeof video.requestVideoFrameCallback !== "function") return;
            const previousrate = video.playbackRate;
            const samplerate = Math.min(4, Math.max(1, 48 / settings.fps));
            await new Promise(resolve=>{
                let callback = 0;
                let watchdog = 0;
                let finished = false;
                const finish = ()=>{
                    if (finished) return;
                    finished = true;
                    clearTimeout(watchdog);
                    if (callback && typeof video.cancelVideoFrameCallback === "function") video.cancelVideoFrameCallback(callback);
                    video.pause();
                    video.playbackRate = previousrate;
                    resolve();
                };
                const schedule = ()=>{
                    clearTimeout(watchdog);
                    callback = video.requestVideoFrameCallback((now, metadata)=>{
                        if (!running) return finish();
                        const due = Math.floor((metadata.mediaTime - settings.start) * settings.fps + 0.0001);
                        if (due < capturedframes()) return schedule();
                        if (due > capturedframes()) return finish();
                        addframe();
                        if (capturedframes() >= framecount) return finish();
                        schedule();
                    });
                    watchdog = setTimeout(finish, 1000);
                };
                video.playbackRate = samplerate;
                schedule();
                video.play().catch(finish);
            });
        }

        async function captureexactframes(video, settings, framecount, captured, addframe){
            for (let index = captured; index < framecount && running; index += 1) {
                await seekvideo(video, settings.start + index / settings.fps);
                addframe();
            }
        }

        function drawframe(context, video, settings){
            const sourcewidth = video.videoWidth;
            const sourceheight = video.videoHeight;
            context.clearRect(0, 0, settings.width, settings.height);
            if (settings.crop) {
                context.drawImage(video, settings.crop.x, settings.crop.y, settings.crop.width, settings.crop.height, 0, 0, settings.width, settings.height);
                return;
            }
            const scale = Math.min(settings.width / sourcewidth, settings.height / sourceheight);
            const drawwidth = Math.round(sourcewidth * scale);
            const drawheight = Math.round(sourceheight * scale);
            const drawx = Math.floor((settings.width - drawwidth) / 2);
            const drawy = Math.floor((settings.height - drawheight) / 2);
            context.fillStyle = "#000000";
            context.fillRect(0, 0, settings.width, settings.height);
            context.drawImage(video, drawx, drawy, drawwidth, drawheight);
        }

        function seekvideo(video, time){
            return new Promise((resolve, reject)=>{
                const target = Math.max(0, Math.min(time, video.duration || time));
                if (Math.abs(video.currentTime - target) < 0.0001 && video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) {
                    resolve();
                    return;
                }
                let timer = 0;
                const done = ()=>{
                    clearTimeout(timer);
                    video.removeEventListener("seeked", done);
                    resolve();
                };
                video.addEventListener("seeked", done, {once: true});
                video.currentTime = target;
                timer = setTimeout(()=>{
                    video.removeEventListener("seeked", done);
                    reject(new Error("video seek timed out"));
                }, 15000);
            });
        }

        function encodegif(frames, settings){
            return new Promise((resolve, reject)=>{
                const worker = new Worker("../assets/static/js/gifski/gifskiworker.js", {type: "module"});
                encoderworker = worker;
                const framecount = Math.max(2, Math.floor(settings.duration * settings.fps));
                const framebytes = settings.width * settings.height * 4;
                let completed = false;
                const chunks = [];
                const finish = callback=>{
                    if (completed) return;
                    completed = true;
                    worker.terminate();
                    if (encoderworker === worker) encoderworker = null;
                    if (cancelencoding === cancel) cancelencoding = null;
                    callback();
                };
                const cancel = ()=>finish(()=>reject(new Error("stopped")));
                cancelencoding = cancel;
                worker.addEventListener("message", async event=>{
                    const reply = event.data;
                    if (reply.type === "chunk") {
                        chunks.push(new File([reply.gif], `part${String(chunks.length).padStart(3, "0")}.gif`, {type: "image/gif"}));
                        const percent = Math.min(99, Math.round(reply.completed / reply.framecount * 100));
                        setprogress(percent, "encoding GIF", `${reply.completed}/${reply.framecount} frames.`);
                        return;
                    }
                    if (reply.error) {
                        finish(()=>reject(new Error(reply.error)));
                        return;
                    }
                    if (reply.type !== "complete") return;
                    try {
                        setprogress(99, "joining GIF frames", `${chunks.length} GIF parts.`);
                        const gif = await mergegifparts(chunks, framecount, settings.loop);
                        finish(()=>resolve(gif));
                    } catch (error) {
                        finish(()=>reject(error));
                    }
                });
                worker.addEventListener("error", event=>{
                    finish(()=>reject(event.error || new Error(event.message)));
                }, {once: true});
                worker.addEventListener("messageerror", ()=>{
                    finish(()=>reject(new Error("the video frames could not be transferred to the GIF encoder.")));
                }, {once: true});
                setprogress(0, "encoding GIF", `0/${framecount} frames.`);
                worker.postMessage({mode: "encode", frames, framecount, framebytes, width: settings.width, height: settings.height, fps: settings.fps, quality: settings.quality, loop: settings.loop}, [frames]);
            });
        }

        async function mergegifparts(parts, framecount, loop){
            if (parts.length === 1) return parts[0];
            const input = parts.map((file, index)=>({file, name: `part${String(index).padStart(3, "0")}.gif`}));
            const names = input.map(item=>item.name);
            const loopoption = loop ? " --loopcount=0" : "";
            const result = await rungifsiclewithprogress({
                input,
                command: [`--merge ${names.join(" ")}${loopoption} -o /out/gifski.gif`],
            }, event=>{
                const fraction = event.total ? event.completed / event.total : 0;
                const percent = 99 + fraction;
                setprogress(percent, "joining GIF frames", `${framecount}/${framecount} frames - ${event.detail}.`);
            });
            if (!result || !result[0]) throw new Error("gifsicle did not join the GIF frames");
            return result[0];
        }

        async function fitlimit(file, settings){
            if (!settings.autolimit || file.size <= settings.limit * 0.965) return {file, loss: 0};
            let low = 0;
            let high = settings.maxloss;
            const target = settings.limit * 0.965;
            const minimumtarget = settings.limit * 0.947;
            let best = file.size <= settings.limit ? file : null;
            let bestloss = 0;
            let finalfile = file;
            const totalsteps = Math.min(4, searchsteps(low, high)) + 1;
            let step = 0;
            while (low <= high && running && step < totalsteps - 1) {
                const loss = Math.floor((low + high) / 2);
                step += 1;
                const updateoptimizerprogress = event=>{
                    const fraction = event.total ? event.completed / event.total : 0;
                    const percent = Math.round((step - 1 + fraction) / totalsteps * 100);
                    setprogress(percent, "fitting the size limit", `pass ${step}/${totalsteps} - ${event.completed}/${event.total}: ${event.detail}`);
                };
                updateoptimizerprogress({completed: 0, total: 2, detail: "loading GIF input"});
                const candidate = await optimizeloss(file, loss, updateoptimizerprogress);
                finalfile = candidate;
                if (candidate.size <= settings.limit && (!best || Math.abs(candidate.size - target) < Math.abs(best.size - target))) {
                    best = candidate;
                    bestloss = loss;
                }
                if (candidate.size >= minimumtarget && candidate.size <= settings.limit) break;
                if (candidate.size <= target) {
                    high = loss - 1;
                } else {
                    low = loss + 1;
                }
            }
            if (!best && running) {
                step += 1;
                const loss = settings.maxloss;
                const updateoptimizerprogress = event=>{
                    const fraction = event.total ? event.completed / event.total : 0;
                    const percent = Math.round((step - 1 + fraction) / totalsteps * 100);
                    setprogress(percent, "fitting the size limit", `pass ${step}/${totalsteps} - ${event.completed}/${event.total}: ${event.detail}`);
                };
                const candidate = await optimizeloss(file, loss, updateoptimizerprogress);
                finalfile = candidate;
                if (candidate.size <= settings.limit) {
                    best = candidate;
                    bestloss = loss;
                }
            }
            return best ? {file: best, loss: bestloss} : {file: finalfile, loss: settings.maxloss};
        }

        async function optimizeloss(file, loss, onprogress){
            const result = await rungifsiclewithprogress({
                input: [{file, name: "source.gif"}],
                command: [`-O2 --lossy=${loss} source.gif -o /out/compressed.gif`],
            }, onprogress);
            if (!result || !result[0]) throw new Error("gifsicle did not return a GIF");
            return result[0];
        }

        function showoutput(file, settings, loss){
            if (outputurl) URL.revokeObjectURL(outputurl);
            outputurl = URL.createObjectURL(file);
            videostage.replaceChildren();
            trimeditor.hidden = true;
            preview.hidden = false;

            videostage.append(image);
            const link = document.createElement("a");

            adjust.addEventListener("click", ()=>{
                output.hidden = true;
                showvideo();
            });
            const detail = document.createElement("span");
            detail.className = "hint";
            detail.textContent = ` ${formatbytes(file.size)} - ${settings.width}x${settings.height} - ${settings.fps}fps`;
            output.replaceChildren(link, adjust, detail);
            output.hidden = false;
        }

        function showfailure(error, settings, failedstage){
            const heading = document.createElement("strong");
            heading.textContent = "conversion details";
            const detail = document.createElement("pre");
            detail.textContent = `stage: ${failedstage}\nerror: ${error.message || String(error)}\nsettings: ${settings.width}x${settings.height}, ${settings.fps}fps, ${settings.duration.toFixed(3)}s`;
            output.replaceChildren(heading, detail);
            output.hidden = false;
        }

        function friendlyerror(error, settings){
            const message = error.message || String(error);
            if (/unreachable/i.test(message)) return `the GIF encoder ran out of working memory. ${memorymessage(settings, estimateframememory(settings))}`;
            return message;
        }

        function setprogress(percent, title, detail){
            const value = Math.max(0, Math.min(100, Math.round(Number(percent) || 0)));
            progressstage = String(title || "processing").toLowerCase();
            progresspanel.hidden = false;
            progresstitle.textContent = title;
            progresspercent.textContent = `${value}%`;
            progressbar.value = value;
            progressdetails.textContent = detail || "";
            status.textContent = `${value}% - ${title}`;
        }

        function progresssettings(settings){
            const framecount = Math.max(2, Math.floor(settings.duration * settings.fps));
            const automatic = settings.automatic.length ? ` Automatic values: ${settings.automatic.join(", ")}.` : "";
            return `${framecount} frames - ${settings.width}x${settings.height} - ${settings.fps}fps.${automatic}`;
        }

        function searchsteps(low, high){
            return Math.max(1, Math.ceil(Math.log2(high - low + 2)));
        }

        function formattime(milliseconds){
            return `${(milliseconds / 1000).toFixed(milliseconds < 10000 ? 1 : 0)}s`;
        }

        function formattimestamp(seconds){
            const milliseconds = Math.max(0, Math.round(seconds * 1000));
            const hours = Math.floor(milliseconds / 3600000);
            const minutes = Math.floor(milliseconds % 3600000 / 60000);
            const whole = Math.floor(milliseconds % 60000 / 1000);
            const fraction = milliseconds % 1000;
            return `${String(hours).padStart(2, "0")}:${String(minutes).padStart(2, "0")}:${String(whole).padStart(2, "0")}:${String(fraction).padStart(3, "0")}`;
        }

        function setrunning(value){
            running = value;
            convert.disabled = value;
            stopbutton.disabled = !value;
        }

        function formatbytes(bytes){
            return `${(bytes / 1000000).toFixed(bytes >= 1000000 ? 2 : 1)} MB`;
        }

        syncautomaticinputs();
    </script>
</body>
</html>
