<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>gifski</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2036%2036%22%3E%3Cpath%20d%3D%22M29%2011h6v14h-6zM1%2011h6v14H1zm8%200h18v14H9z%22%20fill%3D%22%23BBDDF5%22%2F%3E%3Cpath%20fill%3D%22%23231F20%22%20d%3D%22M35%2011V6H1v5h6v14h-6V11h6zm-8%2014H9V11h18v14z%22%2F%3E%3Cpath%20fill%3D%22%23F5F8FA%22%20d%3D%22M31%207h2v3h-2zm-4%200h2v3h-2zm-4%200h2v3h-2zm-4%200h2v3h-2zm-4%200h2v3h-2zm-4%200h2v3H7zm-4%200h2v3H3zm28%2019h2v3h-2zm-4%200h2v3h-2zm-4%200h2v3h-2zm-4%200h2v3h-2zm-4%200h2v3h-2zm-4%200h2v3h-2zm-4%200h2v3H7zm-4%200h2v3H3z%22%2F%3E%3Cpath%20fill%3D%22%2388C9F9%22%20d%3D%22M29%2025V11h1v14zM9%2025V11h1v14z%22%2F%3E%3C%2Fsvg%3E">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="base.css">
    <style>
        .controls {
            border: 1px solid #ccc; padding: 0.6em;
            max-width: 760px;
        }
        .preview {
            border: 1px solid #ccc; margin-top: 0.6em;
            padding: 0.6em;
        }
        .previewmedia {
            display: block; max-width: 100%;
        }
        .status {color: #666; font-size: 0.9em}
        .output {
            border: 1px solid #ccc; margin-top: 0.6em;
            font-family: monospace; padding: 0.5em;
        }
        .warning {color: #a15c00; font-size: 0.85em}
    </style>
</head>
<body>
    <h2>gifski</h2>
    <div class="controls">
        <form id="form">
            <div class="row">
                <label>video <input class="videoinput" type="file" id="videofile" accept="video/*"></label>
                <span class="hint" id="filesize"></span>
            </div>
            <div class="row">
                <label>start <input type="number" id="start" min="0" step="0.1" value="0">s</label>
                <label>duration <input type="number" id="duration" min="0.1" step="0.1" value="3" disabled>s</label>
                <label><input type="checkbox" id="fullduration" checked> full video</label>
                <label>fps <input type="number" id="fps" min="1" max="50" value="24"></label>
            </div>
            <div class="row">
                <label>width <input type="number" id="width" min="8" value="600"></label>
                <label>height <input type="number" id="height" min="8" value="240"></label>
                <label>fit <select id="fit"><option value="cover">crop to fill</option><option value="contain">contain</option></select></label>
            </div>
            <div class="row">
                <label>gifski quality <input type="range" id="quality" min="1" max="100" value="100"><span id="qualityvalue" class="hint">100</span></label>
                <label>max size <input type="number" id="limit" min="0.1" step="0.1" value="9">MB</label>
            </div>
            <div class="row">
                <label><input type="checkbox" id="autolimit" checked> find the lightest LZW loss that fits</label>
                <label>search up to <input type="number" id="maxloss" min="0" max="200" value="80"> loss</label>
            </div>
            <div class="row">
                <button class="btn" id="widepreset" type="button">600x240, 24fps, 9MB preset</button>
                <button class="btn" id="smallpreset" type="button">small size preset</button>
            </div>
            <div class="row">
                <button class="btn" id="convert" type="button">convert</button>
                <button class="btn" id="stop" type="button" disabled>stop</button>
                <span class="status" id="status"></span>
            </div>
            <div class="row hint" id="estimate"></div>
            <p class="warning" id="warning"></p>
        </form>
        <div class="row preview" id="preview"></div>
        <div class="row output" id="output"></div>
    </div>
    <p class="hint">Everything stays in this browser. Gifski and Gifsicle license files are stored beside their local scripts.</p>

    <script type="module">
        import gifsicle from "../assets/static/js/gifsicle/gifsicle.min.js";

        const videofile = document.querySelector("#videofile");
        const filesize = document.querySelector("#filesize");
        const convert = document.querySelector("#convert");
        const stopbutton = document.querySelector("#stop");
        const status = document.querySelector("#status");
        const preview = document.querySelector("#preview");
        const output = document.querySelector("#output");
        const qualityvalue = document.querySelector("#qualityvalue");
        const estimate = document.querySelector("#estimate");
        const warning = document.querySelector("#warning");
        const startinput = document.querySelector("#start");
        const durationinput = document.querySelector("#duration");
        const fulldurationinput = document.querySelector("#fullduration");
        const fpsinput = document.querySelector("#fps");
        const widthinput = document.querySelector("#width");
        const heightinput = document.querySelector("#height");
        const fitinput = document.querySelector("#fit");
        const qualityinput = document.querySelector("#quality");
        const limitinput = document.querySelector("#limit");
        const autolimitinput = document.querySelector("#autolimit");
        const maxlossinput = document.querySelector("#maxloss");
        const widepreset = document.querySelector("#widepreset");
        const smallpreset = document.querySelector("#smallpreset");

        let fileurl = null;
        let outputurl = null;
        let encoderworker = null;
        let running = false;

        /*//////////////////////////////////////////////////////////////////////*/

        videofile.addEventListener("change", ()=>{
            const file = videofile.files[0];
            filesize.textContent = file ? ` (${formatbytes(file.size)})` : "";
            if (fileurl) URL.revokeObjectURL(fileurl);
            fileurl = file ? URL.createObjectURL(file) : null;
            showvideo();
            updateestimate();
        });

        qualityinput.addEventListener("input", ()=>{
            qualityvalue.textContent = qualityinput.value;
        });

        widepreset.addEventListener("click", ()=>{
            widthinput.value = 600;
            heightinput.value = 240;
            fpsinput.value = 24;
            qualityinput.value = 100;
            qualityvalue.textContent = 100;
            limitinput.value = 9;
            fitinput.value = "cover";
            autolimitinput.checked = true;
            maxlossinput.value = 80;
            updateestimate();
        });

        smallpreset.addEventListener("click", ()=>{
            widthinput.value = 320;
            heightinput.value = 128;
            fpsinput.value = 12;
            qualityinput.value = 90;
            qualityvalue.textContent = 90;
            limitinput.value = 3;
            fitinput.value = "cover";
            updateestimate();
        });

        fulldurationinput.addEventListener("change", ()=>{
            durationinput.disabled = fulldurationinput.checked;
            syncduration();
        });

        [startinput, durationinput, fpsinput, widthinput, heightinput, limitinput].forEach(input=>{
            input.addEventListener("input", ()=>{
                if (input === startinput) syncduration();
                else updateestimate();
            });
        });

        stopbutton.addEventListener("click", ()=>{
            running = false;
            if (encoderworker) encoderworker.terminate();
            encoderworker = null;
            status.textContent = "stopped";
            stopbutton.disabled = true;
            convert.disabled = false;
        });

        /*//////////////////////////////////////////////////////////////////////*/

        convert.addEventListener("click", async ()=>{
            if (running) return;
            const sourcevideo = preview.querySelector("video");
            if (!sourcevideo || !fileurl) {
                status.textContent = "pick a video first!";
                return;
            }

            const settings = readsettings(sourcevideo);
            if (!settings) return;
            setrunning(true);
            output.replaceChildren();
            warning.textContent = "";

            try {
                const frames = await captureframes(sourcevideo, settings);
                if (!running) return;
                status.textContent = "gifski is encoding...";
                const gif = await encodegif(frames, settings);
                if (!running) return;
                const result = await fitlimit(gif, settings);
                if (!running) return;
                showoutput(result.file, settings, result.loss);
                if (result.file.size > settings.limit) {
                    warning.textContent = `${formatbytes(result.file.size)} is over the ${formatbytes(settings.limit)} limit. Raise search loss, lower quality, dimensions, fps, or duration.`;
                }
                status.textContent = "done";
            } catch (error) {
                if (running) status.textContent = `failed: ${error.message || error}`;
            } finally {
                if (running) setrunning(false);
            }
        });

        /*//////////////////////////////////////////////////////////////////////*/

        function showvideo(){
            preview.replaceChildren();
            if (!fileurl) return;
            const video = document.createElement("video");
            video.className = "previewmedia";
            video.controls = true;
            video.muted = true;
            video.playsInline = true;
            video.preload = "metadata";
            video.src = fileurl;
            video.addEventListener("loadedmetadata", syncduration, {once: true});
            preview.append(video);
        }

        function syncduration(){
            const video = preview.querySelector("video");
            if (fulldurationinput.checked && video && Number.isFinite(video.duration)) {
                const start = numbervalue(startinput, 0, 0);
                durationinput.value = Math.max(0.1, video.duration - start).toFixed(2);
            }
            updateestimate();
        }

        function updateestimate(){
            const duration = numbervalue(durationinput, 0.1, 0.1);
            const fps = numbervalue(fpsinput, 24, 1, 50);
            const width = numbervalue(widthinput, 600, 8);
            const height = numbervalue(heightinput, 240, 8);
            const framecount = Math.max(2, Math.floor(duration * fps));
            const memory = framecount * width * height * 4;
            estimate.textContent = `${framecount} frames at ${width}x${height}; about ${formatbytes(memory)} is transferred to the encoder.`;
            warning.textContent = memory > 900000000 ? "This selection needs close to a gigabyte of working memory. Lower duration, dimensions, or fps." : "";
        }

        function readsettings(video){
            const start = numbervalue(startinput, 0, 0);
            const duration = fulldurationinput.checked ? video.duration - start : numbervalue(durationinput, 3, 0.1);
            if (!Number.isFinite(duration) || duration <= 0) {
                status.textContent = "the selected range has no video.";
                return null;
            }
            return {
                start,
                duration,
                fps: numbervalue(fpsinput, 24, 1, 50),
                width: numbervalue(widthinput, 600, 8),
                height: numbervalue(heightinput, 240, 8),
                fit: fitinput.value,
                quality: numbervalue(qualityinput, 100, 1, 100),
                limit: numbervalue(limitinput, 9, 0.1) * 1000000,
                autolimit: autolimitinput.checked,
                maxloss: numbervalue(maxlossinput, 80, 0, 200),
            };
        }

        function numbervalue(input, fallback, minimum, maximum){
            let value = Number(input.value);
            if (!Number.isFinite(value)) value = fallback;
            if (minimum !== undefined) value = Math.max(minimum, value);
            if (maximum !== undefined) value = Math.min(maximum, value);
            return value;
        }

        async function captureframes(video, settings){
            const canvas = document.createElement("canvas");
            canvas.width = settings.width;
            canvas.height = settings.height;
            const context = canvas.getContext("2d", {willReadFrequently: true});
            const framecount = Math.max(2, Math.floor(settings.duration * settings.fps));
            const framebytes = settings.width * settings.height * 4;
            const frames = new Uint8Array(framecount * framebytes);
            let captured = 0;

            const addframe = ()=>{
                drawframe(context, video, settings);
                frames.set(context.getImageData(0, 0, settings.width, settings.height).data, captured * framebytes);
                captured += 1;
                status.textContent = `captured ${captured}/${framecount}`;
            };

            await seekvideo(video, settings.start);
            if (typeof video.requestVideoFrameCallback === "function") {
                await new Promise((resolve, reject)=>{
                    const finish = ()=>{
                        video.pause();
                        resolve();
                    };
                    const capture = (now, metadata)=>{
                        if (!running) return finish();
                        const due = Math.min(framecount - 1, Math.floor((metadata.mediaTime - settings.start) * settings.fps + 0.0001));
                        while (captured <= due && captured < framecount) addframe();
                        if (captured === framecount || metadata.mediaTime >= settings.start + settings.duration - 1 / settings.fps) return finish();
                        video.requestVideoFrameCallback(capture);
                    };
                    video.requestVideoFrameCallback(capture);
                    video.play().catch(reject);
                });
            } else {
                for (let index = 0; index < framecount && running; index += 1) {
                    await seekvideo(video, settings.start + index / settings.fps);
                    addframe();
                }
            }

            if (!running) throw new Error("stopped");
            while (captured < framecount) addframe();
            return frames.buffer;
        }

        function drawframe(context, video, settings){
            const sourcewidth = video.videoWidth;
            const sourceheight = video.videoHeight;
            const sourcescale = sourcewidth / sourceheight;
            const targetscale = settings.width / settings.height;
            context.clearRect(0, 0, settings.width, settings.height);
            if (settings.fit === "cover") {
                const cropwidth = sourcescale > targetscale ? sourceheight * targetscale : sourcewidth;
                const cropheight = sourcescale > targetscale ? sourceheight : sourcewidth / targetscale;
                const cropx = (sourcewidth - cropwidth) / 2;
                const cropy = (sourceheight - cropheight) / 2;
                context.drawImage(video, cropx, cropy, cropwidth, cropheight, 0, 0, settings.width, settings.height);
                return;
            }
            const scale = Math.min(settings.width / sourcewidth, settings.height / sourceheight);
            const drawwidth = Math.round(sourcewidth * scale);
            const drawheight = Math.round(sourceheight * scale);
            const drawx = Math.floor((settings.width - drawwidth) / 2);
            const drawy = Math.floor((settings.height - drawheight) / 2);
            context.fillStyle = "#000000";
            context.fillRect(0, 0, settings.width, settings.height);
            context.drawImage(video, drawx, drawy, drawwidth, drawheight);
        }

        function seekvideo(video, time){
            return new Promise(resolve=>{
                const done = ()=>{
                    video.removeEventListener("seeked", done);
                    resolve();
                };
                video.addEventListener("seeked", done, {once: true});
                if (time !== undefined) video.currentTime = Math.min(time, video.duration || time);
                setTimeout(done, 1500);
            });
        }

        function encodegif(frames, settings){
            return new Promise((resolve, reject)=>{
                const worker = new Worker("../assets/static/js/gifski/gifskiworker.js", {type: "module"});
                encoderworker = worker;
                worker.addEventListener("message", event=>{
                    const reply = event.data;
                    worker.terminate();
                    if (encoderworker === worker) encoderworker = null;
                    if (reply.error) reject(new Error(reply.error));
                    else resolve(new File([reply.gif], "gifski.gif", {type: "image/gif"}));
                }, {once: true});
                worker.addEventListener("error", event=>{
                    worker.terminate();
                    if (encoderworker === worker) encoderworker = null;
                    reject(event.error || new Error(event.message));
                }, {once: true});
                const framecount = Math.max(2, Math.floor(settings.duration * settings.fps));
                worker.postMessage({frames, framecount, width: settings.width, height: settings.height, fps: settings.fps, quality: settings.quality}, [frames]);
            });
        }

        async function fitlimit(file, settings){
            if (!settings.autolimit || file.size <= settings.limit) return {file, loss: 0};
            let low = 0;
            let high = settings.maxloss;
            let best = null;
            let bestloss = 0;
            let finalfile = file;
            while (low <= high && running) {
                const loss = Math.floor((low + high) / 2);
                status.textContent = `optimizing at LZW loss ${loss}...`;
                const candidate = await optimizeloss(file, loss);
                finalfile = candidate;
                if (candidate.size <= settings.limit) {
                    best = candidate;
                    bestloss = loss;
                    high = loss - 1;
                } else {
                    low = loss + 1;
                }
            }
            return best ? {file: best, loss: bestloss} : {file: finalfile, loss: settings.maxloss};
        }

        async function optimizeloss(file, loss){
            const result = await gifsicle.run({
                input: [{file, name: "source.gif"}],
                command: [`-O2 --lossy=${loss} source.gif -o /out/compressed.gif`],
            });
            if (!result || !result[0]) throw new Error("Gifsicle did not return a GIF.");
            return result[0];
        }

        function showoutput(file, settings, loss){
            if (outputurl) URL.revokeObjectURL(outputurl);
            outputurl = URL.createObjectURL(file);
            preview.replaceChildren();
            const image = document.createElement("img");
            image.className = "previewmedia";
            image.src = outputurl;
            image.alt = "GIF preview";
            preview.append(image);
            const link = document.createElement("a");
            link.className = "btn";
            link.href = outputurl;
            link.download = "out.gif";
            link.textContent = "download gif";
            const detail = document.createElement("span");
            detail.className = "hint";
            detail.textContent = ` ${formatbytes(file.size)} - ${settings.width}x${settings.height} - ${settings.fps}fps - LZW loss ${loss}`;
            output.replaceChildren(link, detail);
        }

        function setrunning(value){
            running = value;
            convert.disabled = value;
            stopbutton.disabled = !value;
        }

        function formatbytes(bytes){
            return `${(bytes / 1000000).toFixed(bytes >= 1000000 ? 2 : 1)} MB`;
        }
    </script>
</body>
</html>
