<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <title>create favicon</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link class="dynamic-favicon" rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="../base.css">

    <link rel="stylesheet" href="index.css">

    <link rel="stylesheet" href="../branding.css">
</head>
<body>
    <h1 class="toolheading" aria-label="create favicon">
        <img class="toollogo" src="logo.png" alt="create favicon" width="323" height="56">
    </h1>
    <form class="favicon-form" autocomplete="off">
        <div>
            <label for="emoji">emoji -</label>
            <input class="emoji" id="emoji" name="emoji" value="🐈" required>
            <button class="btn" type="submit">create favicon</button>
        </div>
    </form>
    <div>
        <div class="status" aria-live="polite"></div>
        <div class="output"></div>
        <div class="preview"></div>
        <div>check the favicon of the page! ⤴</div>
    </div>
    
    <script src="index.js"></script>

</body>
</html>
