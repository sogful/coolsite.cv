<!doctype html>
<html class="viewport" lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>game</title>
    <style>
        .viewport {
            margin: 0; width: 100%;
            height: 100%; overflow: hidden;
            background: #000;
        }
        .surface {
            display: block; width: 100%;
            height: 100%; object-fit: contain;
            image-rendering: pixelated; touch-action: none;
        }
    </style>
</head>
<body class="viewport">
    <canvas class="surface" tabindex="0" width="1" height="1" aria-label="game screen"></canvas>
    <script type="module" src="studioframe.js"></script>
</body>
</html>
