<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>fangame player</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../base.css">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <main>
        <h1>fangame player</h1>
        <div class="upload">
            <p><label>game <input class="gamefile" type="file" accept=".zip,.exe"></label></p>
            <div class="selection" hidden>
                <label>executable <select class="executables"></select></label>
                <button class="convert" type="button">convert</button>
            </div>
            <button class="cancel" type="button" hidden>cancel</button>
        </div>
        <p class="status" role="status" aria-live="polite">choose a fangame zip or exe!</p>
        <p class="hint">gamemaker 8/8.1 supported</p>
        <section class="player" aria-label="game" hidden>
            <div class="stage">
                <canvas class="gamecanvas" tabindex="0" aria-label="game screen"></canvas>
                <div class="touch" aria-label="touch controls">
                    <div class="directions">
                        <button class="touchbutton" type="button" data-key="37" aria-label="left"><img class="buttonimage" src="assets/controls/left.png" alt="" draggable="false"></button>
                        <button class="touchbutton" type="button" data-key="39" aria-label="right"><img class="buttonimage" src="assets/controls/right.png" alt="" draggable="false"></button>
                    </div>
                    <div class="actions">
                        <button class="touchbutton shoot" type="button" data-key="90" aria-label="shoot"><img class="buttonimage" src="assets/controls/shoot.png" alt="" draggable="false"></button>
                        <button class="touchbutton jump" type="button" data-key="16" aria-label="jump"><img class="buttonimage" src="assets/controls/jump.png" alt="" draggable="false"></button>
                    </div>
                </div>
            </div>
            <div class="gamebuttons">
                <button class="imagebutton pause" type="button" aria-label="pause" title="pause" aria-pressed="false"><img class="buttonimage" src="assets/controls/pause.png" alt="" draggable="false"></button>
                <button class="imagebutton retry" type="button" data-key="82" aria-label="retry" title="retry"><img class="buttonimage" src="assets/controls/reset.png" alt="" draggable="false"></button>
                <button class="imagebutton settings" type="button" aria-label="settings" title="settings" aria-expanded="false"><img class="buttonimage" src="assets/controls/settings.png" alt="" draggable="false"></button>
            </div>
            <button class="imagebutton exitgame" type="button" aria-label="exit game" title="exit game"><img class="buttonimage closeimage" src="assets/controls/close.png" alt="" draggable="false"></button>
            <p class="playerstatus" role="status" aria-live="polite" hidden></p>
            <p class="pausedlabel" hidden>paused</p>
            <section class="gameoptions" aria-label="game settings" hidden>
                <h2 class="gamename"></h2>
                <div class="toolbar menukeys" aria-label="menu controls">
                    <button class="menukey" type="button" data-key="38">up</button>
                    <button class="menukey" type="button" data-key="40">down</button>
                    <button class="menukey" type="button" data-key="13">enter</button>
                </div>
                <p class="savestatus" role="status"></p>
                <div class="toolbar">
                    <button class="exportsave" type="button">export saves</button>
                    <label>import saves <input class="importsave" type="file" accept=".json"></label>
                    <button class="exportgame" type="button">download web version</button>
                    <button class="restart" type="button">restart game</button>
                    <button class="fullscreen" type="button">fullscreen</button>
                </div>
                <details class="report"><summary>conversion report</summary><pre class="diagnostics"></pre></details>
            </section>
            <dialog class="prompt">
                <p class="prompttext"></p>
                <form method="dialog" class="promptbuttons"></form>
            </dialog>
        </section>
        <section class="library" hidden>
            <h2>saved games</h2>
            <div class="games"></div>
        </section>
    </main>
    <script type="module" src="src/app.js"></script>
</body>
</html>
