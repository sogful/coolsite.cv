<!DOCTYPE html>
<html lang="en">
<head>

    <title>tools</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="googlebot" content="index,follow">
    <meta name="google" content="notranslate">

    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="branding.css">

</head>
<body class="page darklogo">

    <div class="bg"></div>

    <div class="content">
        <div class="text">
            <h3>tools</h3>

            <div class="list">
                <div class="toolitem">
                    <a href="iwbtg/">fangame player</a>
                </div>
                <div class="toolitem">
                    <a href="cdx/" aria-label="cdx downloader">
                        <img class="toollogo" src="cdx/logo.png" alt="cdx downloader" width="355" height="57">
                    </a>
                </div>
                <div class="toolitem">
                    <a href="csstrace/" aria-label="css tracer">
                        <img class="toollogo" src="csstrace/logo.png" alt="css tracer" width="249" height="72">
                    </a>
                </div>
                <div class="toolitem">
                    <a href="fontcompress/" aria-label="font compressor">
                        <img class="toollogo" src="fontcompress/logo.png" alt="font compressor" width="250" height="83">
                    </a>
                </div>
                <div class="toolitem">
                    <a href="rive/" aria-label="riv extractor">
                        <img class="toollogo" src="rive/logo.png" alt="riv extractor" width="288" height="60">
                    </a>
                </div>
                <div class="toolitem">
                    <a href="gif/" aria-label="gif converter">
                        <img class="toollogo" src="gif/logo.png" alt="gif converter" width="319" height="90">
                    </a>
                </div>
                <div class="toolitem">
                    <a href="stickerbanner/" aria-label="sticker banner">
                        <img class="toollogo" src="stickerbanner/logo.png" alt="sticker banner" width="283" height="52">
                    </a>
                </div>
                <div class="toolitem">
                    <a href="audiomix/" aria-label="audio mixer">
                        <img class="toollogo" src="audiomix/logo.png" alt="audio mixer" width="327" height="58">
                    </a>
                    <span class="credit">based on <a class="creditlink" href="https://github.com/Firepal/stammer" target="_blank" rel="noreferrer">stammer</a></span>
                </div>
                <div class="toolitem">
                    <a href="svgfavicon/" aria-label="create favicon">
                        <img class="toollogo" src="svgfavicon/logo.png" alt="create favicon" width="323" height="56">
                    </a>
                </div>
                <div class="toolitem">
                    <a href="testfile/" aria-label="create placeholder files">
                        <img class="toollogo" src="testfile/logo.png" alt="create placeholder files" width="407" height="52">
                    </a>
                </div>
                <div class="toolitem">
                    <a href="unicodescribble/" aria-label="unicode scribble matcher">
                        <img class="toollogo" src="unicodescribble/logo.png" alt="unicode scribble matcher" width="524" height="50">
                    </a>
                </div>
                <div class="toolitem">
                    <a href="unicodeart/" aria-label="unicode art">
                        <img class="toollogo" src="unicodeart/logo.png" alt="unicode art" width="236" height="45">
                    </a>
                </div>
                <div class="toolitem">
                    <a href="brailleart/" aria-label="braille art">
                        <img class="toollogo" src="brailleart/logo.png" alt="braille art" width="179" height="55">
                    </a>
                </div>
                <div class="toolitem">
                    <a href="asciiart/" aria-label="ascii art">
                        <img class="toollogo" src="asciiart/logo.png" alt="ascii art" width="154" height="41">
                    </a>
                    <span class="credit">based on <a class="creditlink" href="https://github.com/stong/gradscii-art" target="_blank" rel="noreferrer">gradscii-art</a></span>
                </div>
                <div class="toolitem">
                    <a href="synthid/" aria-label="fake synthid generator">
                        <img class="toollogo" src="synthid/logo.png" alt="fake synthid generator" width="481" height="58">
                    </a>
                </div>
                <div class="toolitem">
                    <a href="bookmarks/" aria-label="bookmarks">
                        <img class="toollogo" src="bookmarks/logo.png" alt="bookmarks" width="279" height="62">
                    </a>
                </div>
                <div class="toolitem">
                    <a href="wifi/" aria-label="wigle search">
                        <img class="toollogo" src="wifi/logo.png" alt="wigle search" width="282" height="54">
                    </a>
                </div>
                <div class="toolitem">
                    <a href="desktopdestroyer/" aria-label="desktop destroyer">
                        <img class="toollogo" src="desktopdestroyer/logo.png" alt="desktop destroyer" width="381" height="54">
                    </a>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
