<!doctype html>
<html lang="en">
<head>

    <meta charset="utf-8">
    <title>braille art</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="../base.css">

    <link rel="stylesheet" href="index.css">

    <link rel="stylesheet" href="../branding.css">
</head>
<body>

    <div class="topbar"><h2 class="toolheading" aria-label="braille art"><img class="toollogo" src="logo.png" alt="braille art" width="179" height="55"></h2></div>

    <div class="stage">

        <div class="padwrap"><canvas class="pad"></canvas></div>

        <div class="controls">

            <div class="toolgroup">
            <div class="row tools">
                <button type="button" data-tool="pen" class="active">scribble</button>
                <button type="button" data-tool="line">line</button>
                <button type="button" data-tool="rect">rectangle</button>
                <button type="button" data-tool="ellipse">circle</button>
                <button type="button" data-tool="fill">fill</button>
                <label title="shapes drawn solid instead of outline"><input type="checkbox" class="filled"> filled</label>
            </div>

            <div class="row tools">
                <button type="button" data-mode="draw" class="modebtn active">draw</button>
                <button type="button" data-mode="erase" class="modebtn">erase</button>
                <label>brush <input type="range" class="brush" min="1" max="6" value="1"><span class="seg brushseg">1</span></label>
                <label title="show faint dot lattice and cell guides"><input type="checkbox" class="showgrid" checked> guides</label>
            </div>

            <div class="row tools">
                <button type="button" class="minibtn undobtn" disabled>undo</button>
                <button type="button" class="minibtn redobtn" disabled>redo</button>
                <button type="button" class="minibtn clearbtn">clear</button>
                <button type="button" class="minibtn invertbtn">invert</button>
                <button type="button" class="minibtn trimbtn">trim</button>
                <button type="button" class="minibtn fliphbtn">flip h</button>
                <button type="button" class="minibtn flipvbtn">flip v</button>
            </div>
            <div class="row tools">
                <span class="hint">shift</span>
                <button type="button" class="minibtn" data-nudge="l">&larr;</button>
                <button type="button" class="minibtn" data-nudge="r">&rarr;</button>
                <button type="button" class="minibtn" data-nudge="u">&uarr;</button>
                <button type="button" class="minibtn" data-nudge="d">&darr;</button>
            </div>
            </div>

            <div class="cards">

            <div class="card">
                <h2>canvas size</h2>
                <div class="row">
                    <label>cols <input type="number" class="cols" min="1" max="200" value="40"></label>
                    <label>rows <input type="number" class="rows" min="1" max="200" value="16"></label>
                    <button type="button" class="minibtn applysize">apply</button>
                </div>
                <div class="hint sizehint"></div>
            </div>

            <div class="card">
                <h2>import image</h2>
                <div class="row">
                    <input type="file" class="imgfile" accept="image/*">
                </div>
                <div class="row">
                    <label>dither
                        <select class="dither">
                            <option value="threshold">threshold</option>
                            <option value="floyd" selected>floyd-steinberg</option>
                            <option value="atkinson">atkinson</option>
                            <option value="bayer">ordered (bayer)</option>
                        </select>
                    </label>
                    <label>fit
                        <select class="fit">
                            <option value="contain" selected>contain</option>
                            <option value="cover">cover</option>
                            <option value="stretch">stretch</option>
                        </select>
                    </label>
                </div>
                <div class="row">
                    <label>level <input type="range" class="thr" min="1" max="254" value="128"><span class="seg thrseg">128</span></label>
                </div>
                <div class="row">
                    <label>bright <input type="range" class="bri" min="-100" max="100" value="0"><span class="seg briseg">0</span></label>
                </div>
                <div class="row">
                    <label>contrast <input type="range" class="con" min="-100" max="100" value="0"><span class="seg conseg">0</span></label>
                </div>
                <div class="row">
                    <label title="treat light pixels as ink instead of dark"><input type="checkbox" class="imginv"> invert</label>
                    <label title="auto-resize canvas to image aspect ratio"><input type="checkbox" class="autosize" checked> auto-size</label>
                </div>
                <div class="hint">tweaks re-render live once an image is loaded</div>
            </div>

            <div class="card outcard">
                <h2>output</h2>
                <div class="row">
                    <button type="button" class="minibtn copybtn">copy</button>
                    <button type="button" class="minibtn dlbtn">download .txt</button>
                    <label title="fill empty cells with blank braille (U+2800) so the block stays rectangular; off uses a normal space"><input type="checkbox" class="blankpad" checked> pad blanks</label>
                </div>
                <textarea class="out" spellcheck="false" wrap="off"></textarea>
                <div class="count countseg"></div>
            </div>

            </div>

        </div>
    </div>

    <script src="index.js"></script>

</body>
</html>
