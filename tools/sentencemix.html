<!doctype html>
<html lang="en">
<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>sentence mix</title>

    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="sentencemix/index.css">
    
</head>
<body>
    <div class="page">
        <header class="topline">
            <a class="backlink" href="./">tools</a>
            <span class="localnote">audio stays in your browser</span>
        </header>

        <main>
            <section class="hero">
                <h1 class="title">sentence mix</h1>
                <p class="intro">Choose a carrier track and a target track. Rebuild the target from short spectral matches in the carrier.</p>
            </section>

            <section class="tracks" aria-label="Audio tracks">
                <article class="trackcard sourcecard">
                    <div class="trackhead">
                        <div>
                            <h2 class="tracktitle">Carrier</h2>
                            <p class="trackhint">Pieces to borrow</p>
                        </div>
                    </div>
                    <label class="dropzone sourcedrop">
                        <span>Carrier audio</span>
                        <input class="sourcefile fileinput" type="file" accept="audio/*" aria-label="Choose carrier audio">
                        <span class="dropdetail">Choose a file or drop one here</span>
                    </label>
                    <div class="trackmeta sourcemeta hidden" hidden>
                        <canvas class="sourcewave waveform" aria-hidden="true"></canvas>
                        <div class="fileline">
                            <span class="sourcefilename filename"></span>
                            <button class="clearbutton clearsource" type="button">remove</button>
                        </div>
                        <span class="sourcedetail trackdetail"></span>
                        <audio class="sourceplayer trackplayer" controls preload="metadata"></audio>
                    </div>
                </article>

                <div class="mixmark" aria-hidden="true">into</div>

                <article class="trackcard targetcard">
                    <div class="trackhead">
                        <div>
                            <h2 class="tracktitle">Target</h2>
                            <p class="trackhint">Shape to recreate</p>
                        </div>
                    </div>
                    <label class="dropzone targetdrop">
                        <span>Target audio</span>
                        <input class="targetfile fileinput" type="file" accept="audio/*" aria-label="Choose target audio">
                        <span class="dropdetail">Choose a file or drop one here</span>
                    </label>
                    <div class="trackmeta targetmeta hidden" hidden>
                        <canvas class="targetwave waveform" aria-hidden="true"></canvas>
                        <div class="fileline">
                            <span class="targetfilename filename"></span>
                            <button class="clearbutton cleartarget" type="button">remove</button>
                        </div>
                        <span class="targetdetail trackdetail"></span>
                        <audio class="targetplayer trackplayer" controls preload="metadata"></audio>
                    </div>
                </article>
            </section>

            <section class="settings" aria-label="Mix settings">
                <div class="settingshead">
                    <h2 class="sectiontitle">Settings</h2>
                </div>

                <div class="controlgrid">
                    <label class="control">
                        <span class="controltop"><span>Slice length</span><output class="framereadout readout">40 ms</output></span>
                        <input class="framelength rangeinput" type="range" min="20" max="120" step="5" value="40">
                        <span class="controlhint">Shorter slices catch more detail; longer ones sound smoother.</span>
                    </label>
                    <label class="control">
                        <span class="controltop"><span>Overlap</span><output class="overlapreadout readout">50%</output></span>
                        <input class="overlap rangeinput" type="range" min="0" max="75" step="5" value="50">
                        <span class="controlhint">More overlap fills gaps and softens the joins.</span>
                    </label>
                    <label class="control">
                        <span class="controltop"><span>Frequency focus</span><output class="focusreadout readout">Neutral</output></span>
                        <input class="frequencyfocus rangeinput" type="range" min="-100" max="100" step="10" value="0">
                        <span class="controlhint">Bias the match toward low or high spectral bands.</span>
                    </label>
                    <label class="control">
                        <span class="controltop"><span>Repeat avoidance</span><output class="repeatsreadout readout">Off</output></span>
                        <input class="repeatavoid rangeinput" type="range" min="0" max="100" step="10" value="0">
                        <span class="controlhint">Discourage reusing a carrier slice too often.</span>
                    </label>
                </div>

                <details class="advanced">
                    <summary>Advanced settings</summary>
                    <div class="advancedgrid">
                        <label class="control">
                            <span class="controltop"><span>Transition smoothness</span><output class="smoothreadout readout">Off</output></span>
                            <input class="smoothness rangeinput" type="range" min="0" max="100" step="10" value="0">
                            <span class="controlhint">Favor nearby carrier slices to make transitions less jumpy.</span>
                        </label>
                        <label class="control selectcontrol">
                            <span class="controltop"><span>Analysis quality</span></span>
                            <select class="quality">
                                <option value="22050">Quick, 22.05 kHz</option>
                                <option value="44100" selected>Full, 44.1 kHz</option>
                            </select>
                            <span class="controlhint">Higher quality preserves more detail and takes longer to analyze.</span>
                        </label>
                        <label class="checkcontrol">
                            <input class="matchloudness checkinput" type="checkbox" checked>
                            <span><strong class="checktitle">Match target loudness</strong><span class="checkhint">Scale each borrowed slice to the target's local level.</span></span>
                        </label>
                    </div>
                </details>

                <div class="actionrow">
                    <button class="mixbutton" type="button" disabled>make the mix</button>
                    <button class="cancelbutton hidden" type="button" hidden>cancel</button>
                    <span class="status hidden" role="status" aria-live="polite" hidden></span>
                </div>
                <progress class="progress hidden" value="0" max="100" aria-label="Mix progress" hidden></progress>
            </section>

            <section class="result hidden" hidden>
                <div class="resulthead">
                    <h2 class="sectiontitle">Your mix</h2>
                    <a class="downloadbutton" download="sentence-mix.wav">download wav</a>
                </div>
                <canvas class="resultwave waveform" aria-hidden="true"></canvas>
                <audio class="resultplayer" controls preload="metadata"></audio>
            </section>

        </main>
    </div>

    <script src="sentencemix/index.js"></script>

</body>
</html>
