<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>unicode art</title>
        <link rel="icon" href="favicon.svg">
        <link rel="stylesheet" href="../base.css">
        <link rel="stylesheet" href="fonts/fonts.css">
        <link rel="stylesheet" href="styles.css">
        <link rel="stylesheet" href="../branding.css">
</head>
    <body>
        <main class="app">
            <h1 class="title toolheading" aria-label="unicode art">
                <img class="toollogo" src="logo.png" alt="unicode art" width="236" height="45">
            </h1>

            <div class="settings">
                <label>
                    lines
                    <input class="linecount" type="number" min="1" max="8" value="1">
                </label>
                <label>
                    width
                    <input class="artwidth" type="range" min="80" max="400" step="10" value="220">
                    <output class="widthvalue">220 px</output>
                </label>
                <label>
                    combining marks
                    <select class="markcount">
                        <option value="0">off</option>
                        <option value="1">up to 1</option>
                        <option value="2" selected>up to 2</option>
                        <option value="3">up to 3</option>
                    </select>
                </label>
                <label>
                    <input class="trim" type="checkbox" checked>
                    trim empty sides
                </label>
            </div>
            <section class="editor" aria-label="drawing editor">
                <div class="toolbar">
                    <button class="tool selected" data-tool="draw" aria-label="draw" title="draw" aria-pressed="true">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25ZM20.71 7.04a.996.996 0 0 0 0-1.41l-2.34-2.34a.996.996 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83Z"/>
                        </svg>
                    </button>
                    <button class="tool" data-tool="erase" aria-label="erase" title="erase" aria-pressed="false">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="m16.24 3.56 4.2 4.2a2 2 0 0 1 0 2.83L10.83 20.2a2 2 0 0 1-1.41.59H6.59a2 2 0 0 1-1.42-.59l-2.61-2.61a2 2 0 0 1 0-2.83L13.41 3.56a2 2 0 0 1 2.83 0ZM4 16.17l2.83 2.83h2.59l3.29-3.29-4.12-4.12L4 16.17ZM13 21v-2h9v2h-9Z"/>
                        </svg>
                    </button>
                    <button class="undo" type="button" disabled>undo</button>
                    <button class="clear" type="button">clear</button>
                    <label class="importlabel">
                        open image
                        <input class="imagefile" type="file" accept="image/*">
                    </label>
                    <label>
                        example
                        <select class="example">
                            <option value="">choose...</option>
                            <option value="cat">cat</option>
                            <option value="wave">wave</option>
                            <option value="face">face</option>
                        </select>
                    </label>
                    <label>
                        <select class="textmode" aria-label="optimization">
                            <option value="separate">optimize for each site</option>
                            <option value="youtube">focus on youtube</option>
                            <option value="discord">focus on discord</option>
                            <option value="twitter">focus on twitter</option>
                        </select>
                    </label>
                    <span class="loading" role="status" hidden>loading..</span>
                </div>
                <div class="drawwrap">
                    <canvas class="drawing" width="880" height="144" tabindex="0" aria-label="draw your art here; use the arrow keys to move and hold shift to draw"></canvas>
                    <span class="drawprompt">draw here</span>
                    <div class="guides" aria-hidden="true"></div>
                </div>
                <p class="error" role="alert" hidden></p>
            </section>
            <section class="results" aria-label="site previews">
                <article class="result" data-site="youtube">
                    <div class="resulthead">
                        <h2 class="sectiontitle">youtube</h2>
                        <span class="resultstatus"></span>
                        <button class="copy" type="button" disabled>copy</button>
                    </div>
                    <div class="surface youtube">
                        <div class="avatar" aria-hidden="true">:3</div>
                        <div class="message">
                            <div class="byline">
                                <span class="author">@nickname</span>
                                <span class="timestamp">just now</span>
                            </div>
                            <div class="arttext"></div>
                            <div class="actions">
                                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M17.77 10.32h-4.2l.64-3.05.02-.23c0-.31-.13-.6-.33-.82L13.17 5l-4.94 4.94c-.28.27-.44.65-.44 1.06v7c0 .83.67 1.5 1.5 1.5h6.75c.62 0 1.16-.38 1.39-.92l2.26-5.29c.07-.17.11-.35.11-.54v-1.43c0-.83-.68-1.5-1.53-1.5ZM3 10h3v10H3V10Z"/>
                                </svg>
                                <svg class="icon dislike" viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M17.77 10.32h-4.2l.64-3.05.02-.23c0-.31-.13-.6-.33-.82L13.17 5l-4.94 4.94c-.28.27-.44.65-.44 1.06v7c0 .83.67 1.5 1.5 1.5h6.75c.62 0 1.16-.38 1.39-.92l2.26-5.29c.07-.17.11-.35.11-.54v-1.43c0-.83-.68-1.5-1.53-1.5ZM3 10h3v10H3V10Z"/>
                                </svg>
                                <span>Reply</span>
                            </div>
                        </div>
                    </div>
                </article>
                <article class="result" data-site="discord">
                    <div class="resulthead">
                        <h2 class="sectiontitle">discord</h2>
                        <span class="resultstatus"></span>
                        <button class="copy" type="button" disabled>copy</button>
                    </div>
                    <div class="surface discord">
                        <div class="avatar" aria-hidden="true">:3</div>
                        <div class="message">
                            <div class="byline">
                                <span class="author">nickname</span>
                                <span class="timestamp">Today at 12:00</span>
                            </div>
                            <div class="arttext"></div>
                        </div>
                    </div>
                </article>
                <article class="result" data-site="twitter">
                    <div class="resulthead">
                        <h2 class="sectiontitle">twitter tweet</h2>
                        <span class="resultstatus"></span>
                        <button class="copy" type="button" disabled>copy</button>
                    </div>
                    <div class="surface twitter">
                        <div class="avatar" aria-hidden="true">:3</div>
                        <div class="message">
                            <div class="byline">
                                <span class="author">nickname</span>
                                <span class="timestamp">@username · now</span>
                            </div>
                            <div class="arttext"></div>
                        </div>
                    </div>
                </article>
            </section>
        </main>
        <script type="module" src="scripts/app.js?v=4"></script>
    </body>
</html>
