    <script>

        fetch("https://status.cafe/users/meow/status.json")
            .then(function(response) {return response.json()})
            .then(function(data) {
                document.querySelector(".status").innerHTML = `
                    <span class="s1">${data.content}</span>
                    <div style="display:inline;font-size:0.5em">
                        <span class="midtext">${data.timeAgo}</span>

                    </div>
                `;
            }).catch(function(error) {
                console.error("failed to fetch status?! ", error);
            });

        // performance testing, to show set opacity to 1 :p
        (function() {
            const fpsdiv = document.createElement("div");
            Object.assign(fpsdiv.style, {
                display: "flex", position: "fixed",
                whiteSpace: "pre-line", flexDirection: "column",
                top: "20px", left: "20px",
                fontSize: "16px", background: "rgba(0,0,0,0.3)",
                boxShadow: "0 4px 16px rgba(0,0,0,0.3)",
                padding: "15px", borderRadius: "15px", height: "auto",
                zIndex: 2000, color: "#5dc9ff", userSelect: "none", opacity: "0"
            });
            fpsdiv.textContent = "60 fps";
            document.body.appendChild(fpsdiv);

            let last = performance.now();
            let frames = 0;
            function loop() {
                frames++;
                const now = performance.now();
                if ((now - last) >= 500) {
                    const fps = frames * 1000 / (now - last);
                    fpsdiv.textContent = Math.round(fps) + " fps";
                    last = now;
                    frames = 0;
                }; requestAnimationFrame(loop);
            }; requestAnimationFrame(loop);
        })();

        /*//////////////////////////////////////////////////////////////////////*/

        (function() {
            const kofi = document.querySelector(".kofi");
            const kofipanel = document.querySelector(".kofipanel");
            let loaded = false;
            kofi.addEventListener("click", function () {
                if (!loaded) {
                    kofipanel.innerHTML = '<iframe src="https://ko-fi.com/sogful/?hidefeed=true&widget=true&embed=true"></iframe>';
                    loaded = true;
                }
                kofipanel.classList.toggle("open");
            });
            document.addEventListener("click", function (e) {
                if (!kofipanel.classList.contains("open")) return;
                if (kofipanel.contains(e.target) || kofi.contains(e.target)) return;
                kofipanel.classList.remove("open");
            });
        })();

        (function() {
            let loaded = false;
            const more = document.querySelector(".more");
            const morebtn = document.querySelector(".morebutton");
            morebtn.addEventListener("click", function () {
                const showing = more.style.display === "flex";
                if (showing) {
                    more.style.display = "none";
                    this.textContent = "see more buttons..";
                    more.querySelectorAll("iframe[src]").forEach(function (iframe) {
                        let src = iframe.src;
                        iframe.setAttribute("data-src", src);
                        iframe.removeAttribute("src");
                    });
                } else {
                    more.style.display = "flex";
                    this.textContent = "see less buttons..";
                    if (!loaded) {
                        more.querySelectorAll("img[data-src]").forEach(function (img) {
                            let src = img.dataset.src; img.src = src;
                            img.removeAttribute("data-src");
                        });
                        more.querySelectorAll("iframe[data-src]").forEach(function (iframe) {
                            let src = iframe.dataset.src; iframe.src = src;
                            iframe.removeAttribute("data-src");
                        });
                        loaded = true;
                    } else {
                        more.querySelectorAll("iframe[data-src]").forEach(function (iframe) {
                            let src = iframe.dataset.src; iframe.src = src;
                            iframe.removeAttribute("data-src");
                        });
                    }
                }
            });
        })();

        (function() {
            function copyablefrom(target) {
                return target.closest(".button") || target.closest("iframe");
            }
            document.addEventListener("mousedown", function (e) {
                if (e.button !== 1) return;
                const el = copyablefrom(e.target);
                if (!el) return;
                e.preventDefault();
                e.stopPropagation();
                e.stopImmediatePropagation();

                const copiable = el.tagName === "IMG" ? el.parentElement : el;
                const clone = copiable.cloneNode(true);
                (function cleannode(node) {
                    if (node.removeAttribute) {
                        node.removeAttribute("style");
                        node.removeAttribute("class");
                        if (node.tagName === "IMG" || node.tagName === "IFRAME") {
                            if (node.hasAttribute("src")) {
                                let src = node.getAttribute("src");
                                if (src && !src.startsWith("https://coolsite.cv/")) {
                                    node.setAttribute("src", "https://coolsite.cv/" + src.replace(/^\/+/, ''));
                                }
                            }
                            if (node.hasAttribute("data-src")) {
                                let dsrc = node.getAttribute("data-src");
                                if (dsrc && !dsrc.startsWith("https://coolsite.cv/")) {
                                    node.setAttribute("data-src", "https://coolsite.cv/" + dsrc.replace(/^\/+/, ''));
                                }
                            }
                        }
                    }
                    Array.from(node.childNodes).forEach(cleannode);
                })(clone);
                navigator.clipboard.writeText(clone.outerHTML);

                const copied = document.querySelector(".copied");
                const copa = copied && copied.querySelector("a");
                if (copa) copa.textContent = "copied!";
                if (copied) {
                    copied.style.opacity = "1";
                    setTimeout(function() {copied.style.opacity = "0"}, 1000);
                }
            });
            document.addEventListener("auxclick", function (e) {
                if (e.button !== 1) return;
                if (!copyablefrom(e.target)) return;
                e.preventDefault();
                e.stopPropagation();
            });
        })();

        /*//////////////////////////////////////////////////////////////////////*/

        (function() {
            const bounce = document.getElementById("bounce");
            const cvtuah = document.querySelector(".cvtuah");
            if (!bounce || !cvtuah) return;
            bounce.style.transform = "translate(-50%, -50%)";

            let x = 0, y = 0, dx = 2, dy = 2;
            let animating = false;

            function getdims(el) {
                const r = el.getBoundingClientRect();
                return {width: r.width, height: r.height};
            }

            function animate() {
                const bounds = cvtuah.getBoundingClientRect();
                const dims = { width: bounds.width, height: bounds.height };
                const maxx = window.innerWidth - dims.width;
                const maxy = window.innerHeight - dims.height;

                let nx = x + dx; let ny = y + dy;
                const nleft = bounds.left + dx;
                const ntop = bounds.top + dy;

                if (nleft <= 0 || nleft >= maxx) {
                    dx = -dx; nx = x + dx;
                }
                if (ntop <= 0 || ntop >= maxy) {
                    dy = -dy; ny = y + dy;
                }
                x = nx; y = ny;
                cvtuah.style.left = x + "px";
                cvtuah.style.top = y + "px";

                requestAnimationFrame(animate);
            }

            function initpos() {
                bounce.classList.add("spin");
                bounce.style.left = "50%";
                bounce.style.top = "50%";
                bounce.style.transform = "translate(-50%, -50%)";
            }
            if (bounce.complete) {initpos()}
            else {bounce.addEventListener("load", initpos)}

            bounce.addEventListener("click", function () {
                if (animating) return;
                bounce.style.opacity = "0.5";
                const r = bounce.getBoundingClientRect();
                x = r.left; y = r.top;

                cvtuah.style.left = x + "px";
                cvtuah.style.top = y + "px";
                cvtuah.style.display = "block";

                animating = true;
                animate();
            });

            let rtimeout;
            window.addEventListener("resize", function () {
                clearTimeout(rtimeout);
                rtimeout = setTimeout(function () {
                    if (!animating) {initpos()}
                    else {
                        const dims = getdims(cvtuah);
                        const maxx = window.innerWidth - dims.width;
                        const maxy = window.innerHeight - dims.height;
                        x = Math.max(0, Math.min(x, maxx));
                        y = Math.max(0, Math.min(y, maxy));
                        cvtuah.style.left = x + "px";
                        cvtuah.style.top = y + "px";
                    }
                }, 50);
            });
        })();

    </script>
</body>
</html>
