<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<title>yap sessions</title>
	<meta name="description" content="i'm not actually good at writing..">
	<meta name="theme-color" content="#064daff">
	
	<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><text y='52' font-size='52'>%F0%9F%93%9D</text></svg>">
	<link rel="stylesheet" href="/assets/static/bg.css">
	<link rel="stylesheet" href="blog.css">
	<script src="/assets/static/js/bg.js" defer></script>
	<script src="blog.js" defer></script>
</head>
<body>
	<main>
		<section class="articleindex" aria-labelledby="indextitle">
			<div class="indexheading">
				<h1 class="indextitle">blog</h1>
				<p class="articlecount" aria-live="polite">loading..</p>
			</div>
			<nav class="articlelist" aria-label="Articles"></nav>
		</section>

		<section class="articleview" aria-live="polite" aria-busy="false" hidden>
			<button class="backbutton" type="button" aria-label="Back to article list">
				<svg viewBox="0 0 24 24" aria-hidden="true">
					<path d="M15 5 8 12l7 7M9 12h11"/>
				</svg>
				<span>articles</span>
			</button>

			<div class="readingstate" hidden></div>
			<article class="article" hidden>
				<header class="articleheader">
					<div class="articlelabels"></div>
					<h1 class="articletitle"></h1>
					<p class="articlesummary"></p>
					<time class="articledate"></time>
				</header>
				<div class="articlebody"></div>
			</article>
		</section>
	</main>

	<noscript>
		<div class="noscript">What are you scared of?</div>
